          const ordenarPor = (campo) => {
            setOrdenInv(o => ({
              campo,
              dir: o.campo === campo && o.dir === 'asc' ? 'desc' : 'asc'
            }));
            setPaginaActual(0);
          };

          /**
           * [REV-14 · MEJORA] Exporta el inventario tal como se está viendo.
           * Calendario, Proveedores y Órdenes ya tenían botón de exportar; el
           * inventario, que es la consulta más usada, obligaba a copiar a mano.
           */
          const exportarInventario = () => {
            const encabezado = ['NO. INVENTARIO', 'EQUIPO / TECNOLOGÍA', 'CATEGORÍA', 'MARCA', 'MODELO',
                                'SERIE', 'FABRICANTE', 'ÁREA', 'NIVEL DE RIESGO', 'ESTATUS',
                                'MOTIVO FUERA DE SERVICIO', 'PÓLIZA', 'PROVEEDOR MTTO.',
                                'FRECUENCIA', 'ÚLTIMO MP', 'PRÓXIMO MP', 'FECHA DE ALTA', 'DESCRIPCIÓN'];
            const filas = [encabezado].concat(equiposFiltrados.map(e => [
              e.numeroInventario || '', e.nombre || '', e.tipoTecnologia || '', e.marca || '',
              e.modelo || '', e.numeroSerie || '', e.fabricante || '', e.ubicacion || '',
              e.nivelRiesgo || '', e.estatus || '', e.motivoFueraServicio || '',
              e.polizaMantenimiento || '', e.proveedorMantenimiento || '',
              e.frecuenciaMantenimiento || '', e.ultimoMantenimiento || '',
              e.proximoMantenimiento || '', e.fechaAlta || '', e.descripcion || ''
            ]));

            const referencia = [
              ['Inventario de equipo médico · HSAIP'],
              [],
              ['Hoja', inventarioTab],
              ['Área', filterUbicacion],
              ['Estatus', filterEstatus],
              ['Búsqueda', searchTerm || '(sin texto)'],
              ['Equipos exportados', equiposFiltrados.length],
              ['Equipos en la hoja', equiposHoja.length],
              ['Generado por', usuarioActivo || ''],
              ['Fecha de generación', new Date().toLocaleString('es-MX')]
            ];

            exportarExcel('Inventario_' + inventarioTab, [
              { nombre: 'Inventario', filas, anchos: [16, 40, 18, 18, 18, 20, 18, 24, 8, 16, 26, 10, 24, 12, 12, 12, 14, 40] },
              { nombre: 'Referencia', filas: referencia, anchos: [28, 44] }
            ]);
          };

          // [NEW-09] Vista previa del siguiente folio para el formulario de alta.
          const siguienteFolioPreview = useMemo(
              () => previsualizarSiguienteFolio(nuevoEquipo.origen, equipos),
              [nuevoEquipo.origen, equipos]
          );

          const equiposCalendario = useMemo(() => {
              return equipos.filter(e => {
                  if (e.origen !== inventarioTab) return false;
                  
                  // FILTRO: Excluir equipos sin frecuencia definida
                  if (!e.frecuenciaMantenimiento || e.frecuenciaMantenimiento === '') return false;
                  
                  // FILTRO: Excluir BAJA DEFINITIVA del calendario
                  if (esBajaDefinitiva(e)) return false;

                  // [REV-14 · FIX-B3] Misma comparación normalizada que en Inventario.
                  if (filterUbicacionCal !== 'Todas' &&
                      normTexto(e.ubicacion) !== normTexto(filterUbicacionCal)) return false;

                  // [REV-14 · FIX-B2] El buscador del calendario solo miraba el
                  // número de control: buscar "ventilador" o una marca no
                  // devolvía nada, aunque el campo no dijera que era exclusivo
                  // de folios. Ahora acepta ambas cosas.
                  if (!coincideTerminos(terminosBusqueda(busquedaCalendario),
                        [e.numeroInventario, e.nombre, e.marca, e.modelo, e.numeroSerie, e.ubicacion])) return false;

                  if (filterMesCal !== 'Todos') {
                      const monthIdx = parseInt(filterMesCal, 10);
                      const programados = obtenerMesesProgramados(e.ultimoMantenimiento, e.frecuenciaMantenimiento, calendarYear);
                      if (!programados.has(monthIdx)) return false;
                  }
                  return true;
              });
          }, [equipos, inventarioTab, filterUbicacionCal, filterMesCal, busquedaCalendario, calendarYear]);

          /**
           * [REV-12 · MEJORA 5] Exporta el calendario tal como se ve, con los
           * filtros aplicados: una columna por mes con PROGRAMADO / EJECUTADO,
           * más las columnas de identificación del equipo.
           */
          const exportarCalendario = () => {
            const encabezado = ['CONTROL', 'EQUIPO', 'MARCA', 'MODELO', 'SERIE', 'ÁREA',
                                'FRECUENCIA', 'ÚLTIMO MP', 'ESTATUS'].concat(mesesAbreviados);
            const filas = [encabezado];

            equiposCalendario.forEach(eq => {
              const programados = obtenerMesesProgramados(eq.ultimoMantenimiento, eq.frecuenciaMantenimiento, calendarYear);
              const ejecutados = limpiarHistorial(eq.historialEjecuciones || '');
              const fuera = estaFueraServicio(eq);
              const meses = [];
              for (let m = 0; m < 12; m++) {
                const clave = calendarYear + '-' + String(m + 1).padStart(2, '0');
                if (ejecutados.includes(clave)) meses.push('EJECUTADO');
                else if (programados.has(m)) meses.push(fuera ? 'PROGRAMADO (FUERA DE SERVICIO)' : 'PROGRAMADO');
                else meses.push('');
              }
              filas.push([
                eq.numeroInventario || '', eq.nombre || '', eq.marca || '', eq.modelo || '',
                eq.numeroSerie || '', eq.ubicacion || '', eq.frecuenciaMantenimiento || '',
                eq.ultimoMantenimiento || '', eq.estatus || ''
              ].concat(meses));
            });

            // Hoja de referencia para quien reciba el archivo sin contexto
            const referencia = [
              ['Programa Anual de Mantenimiento Preventivo · HSAIP-FOR-INB-007'],
              [],
              ['Hoja de inventario', inventarioTab],
              ['Área', filterUbicacionCal],
              ['Mes filtrado', filterMesCal === 'Todos' ? 'Todos' : mesesAbreviados[parseInt(filterMesCal, 10)]],
              ['Año', String(calendarYear)],
              ['Equipos en el programa', equiposCalendario.length],
              ['Generado por', usuarioActivo || ''],
              ['Fecha de generación', new Date().toLocaleString('es-MX')]
            ];

            exportarExcel('Calendario_MP_' + inventarioTab + '_' + calendarYear, [
              { nombre: 'Calendario', filas, anchos: [14, 38, 16, 16, 18, 22, 12, 12, 16].concat(mesesAbreviados.map(() => 14)) },
              { nombre: 'Referencia', filas: referencia, anchos: [30, 40] }
            ]);
          };

          // [FIX] Sincronización vía JSONP + errores visibles para el usuario
          /**
           * [REV-12] El backend cachea getAll 90 s. El arranque automático
           * aprovecha esa caché (respuesta casi inmediata); presionar
           * "Sincronizar Sheets" manda fresco=1 y obliga a releer las hojas.
           */
          const handleSyncSheets = async (forzar) => {
            setIsSyncing(true);
            setSyncError(null);
            if (!GOOGLE_SHEETS_WEBAPP_URL) {
              setSyncError('No hay URL de backend configurada.');
              setIsSyncing(false);
              return;
            }
            try {
              const data = await jsonpConReintentos(
                forzar === true ? { action: 'getAll', fresco: '1' } : { action: 'getAll' });

              // [FIX-06] Conserva el id real del backend; ya no genera "Propio-undefined"
              const procesarHoja = (arr, origen) => (arr || [])
                .filter(e => e.numeroInventario || e.nombre)
                .map(e => ({
                  ...e,
                  origen,
                  id: e.id ? String(e.id) : `${origen}-FILA-${e._fila}`
                }));

              const consolidado = [
                ...procesarHoja(data.propio, 'Propio'),
                ...procesarHoja(data.comodato, 'Comodato'),
                ...procesarHoja(data.renta, 'Renta')
              ];

              setEquipos(consolidado);
              setBitacora(data.bitacora || []);
              setIndicadores(data.indicadores || []); // [REV-05] misma hoja de cálculo
              setUltimaSync(data.sincronizado || new Date().toLocaleString('es-MX'));

              // [PERF] Persistir para el arranque instantáneo de la próxima visita
              CACHE_LOCAL.guardar({
                equipos: consolidado,
                indicadores: data.indicadores || [],
                bitacora: data.bitacora || [],
                ultimaSync: data.sincronizado || ''
              });

              if (consolidado.length === 0) {
                setSyncError('El backend respondió correctamente, pero no devolvió equipos. Verifica los nombres de las hojas (Propio, Comodato, Renta) y que tengan datos.');
              }
            } catch (error) {
              console.error(error);
              if (esAccesoDenegado(error)) { cerrarSesion(); return; }
              setSyncError(error.message || 'Error desconocido al sincronizar.');
            } finally {
              setIsSyncing(false);
            }
          };

          // [FIX] Guardado confirmado: si falla, revierte el estado local
          const directSaveToSheets = async (equipo, estadoPrevio) => {
            if (!GOOGLE_SHEETS_WEBAPP_URL) return false;
            setIsSyncing(true);
            setSyncError(null);
            try {
              await jsonpConReintentos({
                action: 'save',
                payload: JSON.stringify({
                  action: 'edit',
                  data: equipo,
                  sheetName: equipo.origen,
                  originalInventario: equipo.numeroInventario,
                  fila: equipo._fila
                })
              });
              setUltimaSync(new Date().toLocaleString('es-MX'));
              return true;
            } catch (error) {
              console.error(error);
              // Revierte para que la pantalla no muestre datos que no se persistieron
              if (estadoPrevio) setEquipos(estadoPrevio);
              if (esAccesoDenegado(error)) { cerrarSesion(); return false; }
              setSyncError('No se guardó en Google Sheets: ' + error.message);
              return false;
            } finally {
              setIsSyncing(false);
            }
          };

          const handleUpdateEquipo = async (e) => {
            e.preventDefault();
            const estadoPrevio = equipos;
            setEquipos(equipos.map(eq => eq.id === equipoEditado.id ? equipoEditado : eq));
            setSelectedEquipo(equipoEditado);
            setIsEditing(false);
            await directSaveToSheets(equipoEditado, estadoPrevio);
          };

          /**
           * [REV-14] Diagnóstico de la hoja destino desde el propio modal.
           * Responde en pantalla a "¿por qué no me deja dar de alta aquí?"
           * sin tener que abrir el editor de Apps Script: dice si la pestaña
           * existe, qué encabezados detectó, cuáles faltan, si hay rangos
           * protegidos y qué folio asignaría. No escribe nada en el libro.
           */
          const verificarHojaAlta = async () => {
            setDiagHoja({ cargando: true });
            try {
              const r = await jsonpConReintentos({ action: 'diagHoja', hoja: nuevoEquipo.origen });
              setDiagHoja({ cargando: false, datos: r });
            } catch (err) {
              if (esAccesoDenegado(err)) { setShowAddEquipo(false); cerrarSesion(); return; }
              setDiagHoja({ cargando: false, error: mensajeAmigable(err) });
            }
          };

          const handleAddEquipo = async (e) => {
            e.preventDefault();

            // Validación previa: evita altas incompletas en el inventario.
            // [NEW-09] Ya no se valida numeroInventario aquí: lo asigna el servidor.
            // [FIX-23] Los mensajes van a errorAlta, que SÍ se ve dentro del modal.
            if (!nuevoEquipo.nombre || !nuevoEquipo.ubicacion) {
              setErrorAlta('El nombre del equipo y el área/ubicación son obligatorios.');
              return;
            }
            if (!nuevoEquipo.nivelRiesgo) {
              setErrorAlta('Selecciona un nivel de riesgo (I, II o III).');
              return;
            }

            // [FIX-24] Una referencia por alta. Si el usuario reintenta tras un
            // error de red, viaja la MISMA referencia y el backend devuelve el
            // resultado original en lugar de agregar el equipo otra vez.
            if (!refAlta.current) refAlta.current = nuevaReferencia();

            setIsSyncing(true);
            setErrorAlta(null);
            setSyncError(null);
            try {
              // [NEW-09] El backend calcula el folio real (PAT/CPAT/RPAT + consecutivo)
              // de forma atómica y lo regresa en la respuesta; esto evita folios
              // duplicados si dos personas dan de alta equipo al mismo tiempo.
              // [FIX-22] Sin reintentos automáticos: un appendRow repetido duplica el equipo.
              const resultado = await jsonpEscrituraUnica({
                action: 'save',
                payload: JSON.stringify({
                  action: 'add',
                  data: nuevoEquipo,
                  sheetName: nuevoEquipo.origen,
                  clientRef: refAlta.current
                })
              });
              const folioAsignado = resultado.numeroInventario || siguienteFolioPreview;
              const matchNum = String(folioAsignado).match(/(\d+)\s*$/);
              const equipoGuardar = {
                ...nuevoEquipo,
                numeroInventario: folioAsignado,
                numero: matchNum ? parseInt(matchNum[1], 10) : '',
                id: resultado.id || `INV-${folioAsignado}`
              };
              setEquipos([...equipos, equipoGuardar]);
              setShowAddEquipo(false);
              setNuevoEquipo(estadoInicialEquipo);
              setErrorAlta(null);
              setDiagHoja(null);
              refAlta.current = null;          // el siguiente alta usa una referencia nueva
              setUltimaSync(new Date().toLocaleString('es-MX'));

              // [REV-14] El equipo se pinta al instante con lo que se capturó,
              // pero lo que vale es lo que quedó en la hoja: si una columna no
              // existía en esa pestaña, el dato se perdió en el camino. Una
              // resincronización en segundo plano trae la fila real y corrige
              // la pantalla sin que el usuario tenga que hacer nada.
              setTimeout(() => { handleSyncSheets(true); }, 400);
            } catch (error) {
              // [FIX-25] Sesión expirada: mismo trato que en el resto de la app
              if (esAccesoDenegado(error)) {
                setShowAddEquipo(false);
                refAlta.current = null;
                cerrarSesion();
                return;
              }
              setErrorAlta(mensajeAmigable(error));
            } finally {
              setIsSyncing(false);
            }
          };

          /**
           * [FIX-26] Traduce los errores técnicos a algo accionable. El texto
           * original se conserva al final para no perder información al
           * momento de reportar la falla.
           */
          const mensajeAmigable = (error) => {
            const msg = String((error && error.message) || error || '');
            const b = msg.toLowerCase();

            if (b.indexOf('permiso') > -1 || b.indexOf('permission') > -1) {
              return 'El script no tiene permiso de escritura sobre la hoja de cálculo. ' +
                     'Revisa que la cuenta que ejecuta el Apps Script sea Editor del libro ' +
                     'y que la hoja no tenga rangos protegidos. (' + msg + ')';
            }
            if (b.indexOf('tiempo de espera') > -1 || b.indexOf('timeout') > -1) {
              return 'El servidor tardó demasiado en responder. El equipo PUEDE haberse guardado: ' +
                     'sincroniza antes de volver a intentar. Si vuelves a presionar Guardar, ' +
                     'el sistema reconoce el reenvío y no lo duplica.';
            }
            if (b.indexOf('sistema ocupado') > -1) {
              return 'Otra persona está guardando en este momento. Espera unos segundos y vuelve a intentar.';
            }
            if (b.indexOf('hoja no encontrada') > -1) {
              return 'No existe la hoja destino en el libro. Verifica que se llamen exactamente ' +
                     'Propio, Comodato y Renta. (' + msg + ')';
            }
            if (b.indexOf('spreadsheet_id') > -1) {
              return 'Falta configurar SPREADSHEET_ID en Codigo.gs. (' + msg + ')';
            }
            if (b.indexOf('no se pudo contactar') > -1) {
              return 'No hubo respuesta del backend. Revisa la URL de implementación y que el ' +
                     'despliegue esté como "Ejecutar como: Yo" y "Acceso: Cualquier usuario".';
            }
            return msg || 'Error desconocido.';
          };

          const toggleMantenimientoEjecutado = (equipo, monthIndex, year) => {
              const strY = year.toString();
              const strM = (monthIndex + 1).toString().padStart(2, '0');
              const targetStr = `${strY}-${strM}`;

              let historialArr = limpiarHistorial(equipo.historialEjecuciones);
              if (historialArr.includes(targetStr)) { historialArr = historialArr.filter(h => h !== targetStr); } 
              else { historialArr.push(targetStr); }
              historialArr = [...new Set(historialArr)];

              const ejecutando = historialArr.includes(targetStr);
              const updatedEquipo = { ...equipo, historialEjecuciones: historialArr.join(',') };
              const estadoPrevio = equipos;
              setEquipos(equipos.map(eq => eq.id === updatedEquipo.id ? updatedEquipo : eq));

              directSaveToSheets(updatedEquipo, estadoPrevio).then(ok => {
                // [REV-12 · MEJORA 6] Al marcar ejecutado se abre el detalle del
                // mantenimiento. El folio de bitácora se levanta igual que antes;
                // lo único que cambia es que ahora hay oportunidad de capturar
                // hallazgos, refacciones y tiempo de paro sin salir del calendario.
                // "Solo marcar" reproduce exactamente el comportamiento anterior.
                if (ok && ejecutando) {
                  setDetalleMP({
                    equipo,
                    periodo: targetStr,
                    tecnico: tecnicoActivo || usuarioActivo || '',
                    hallazgos: '',
                    acciones: '',
                    refacciones: '',
                    tiempoParoHrs: '',
                    proveedor: '',
                    estatusFinal: 'Concluido',
                    ordenSubida: '',   // [REV-15] nombre del archivo si se sube la orden
                    guardando: false,
                    error: null
                  });
                }
              });
          };

          /**
           * [REV-12] Levanta el folio de bitácora del mantenimiento marcado.
           * Se ejecuta UNA sola vez por marca: con detalle (botón "Guardar
           * detalle") o sin él ("Solo marcar", cerrar o clic fuera).
           * jsonpEscrituraUnica no reintenta, porque un appendRow repetido
           * generaría dos folios del mismo evento.
           */
          const registrarBitacoraMP = async (conDetalle) => {
            const d = detalleMP;
            if (!d || d.guardando) return;
            setDetalleMP({ ...d, guardando: true, error: null });
            try {
              await jsonpEscrituraUnica({
                action: 'save',
                payload: JSON.stringify({
                  action: 'bitacora',
                  data: {
                    numeroInventario: d.equipo.numeroInventario,
                    nombreEquipo: d.equipo.nombre,
                    origen: d.equipo.origen,
                    ubicacion: d.equipo.ubicacion,
                    tipo: 'MP',
                    periodo: d.periodo,
                    tecnico: (conDetalle && d.tecnico) ? d.tecnico
                                                       : (tecnicoActivo || usuarioActivo || 'No especificado'),
                    hallazgos:     conDetalle ? d.hallazgos : '',
                    acciones:      conDetalle ? d.acciones : '',
                    refacciones:   conDetalle ? d.refacciones : '',
                    tiempoParoHrs: conDetalle ? d.tiempoParoHrs : '',
                    proveedor:     conDetalle ? d.proveedor : '',
                    estatusFinal:  conDetalle ? (d.estatusFinal || 'Concluido') : 'Concluido',
                    // [REV-15] La orden se sube por su cuenta; aquí solo se deja
                    // constancia de su nombre, también si se eligió "Solo marcar".
                    ordenArchivada: d.ordenSubida || ''
                  }
                })
              });
              // El técnico capturado se recuerda para los siguientes registros
              if (conDetalle && d.tecnico && d.tecnico !== tecnicoActivo) setTecnicoActivo(d.tecnico);
              setDetalleMP(null);
            } catch (err) {
              console.error('Bitácora:', err);
              if (esAccesoDenegado(err)) { setDetalleMP(null); cerrarSesion(); return; }
              setDetalleMP(actual => actual
                ? { ...actual, guardando: false, error: mensajeAmigable(err) }
                : actual);
            }
          };

          const campoMP = (clave, valor) =>
            setDetalleMP(actual => actual ? { ...actual, [clave]: valor } : actual);

          const getEstatusColor = (estatus) => {
            const status = estatus ? estatus.toLowerCase() : '';
            if (status.includes('servicio') && !status.includes('fuera')) return 'bg-emerald-100 text-emerald-800 border-emerald-300';
            if (status.includes('fuera de servicio')) return 'bg-red-100 text-red-800 border-red-300';
            return 'bg-gray-100 text-gray-800 border-gray-300'; 
          };

          // ============================================================================
          // ETIQUETA DE IDENTIFICACIÓN DEL EQUIPO
          // Vista previa + descarga PNG + impresión directa
          // ============================================================================
          const EtiquetaEquipo = ({ equipo }) => {
            const [imgUrl, setImgUrl] = useState(null);
            const [errorEtiqueta, setErrorEtiqueta] = useState(null);

            useEffect(() => {
              let vigente = true;
              setImgUrl(null);
              setErrorEtiqueta(null);
              generarEtiqueta(equipo)
                .then(url => { if (vigente) setImgUrl(url); })
                .catch(err => { if (vigente) setErrorEtiqueta(err.message); });
              return () => { vigente = false; };
            }, [equipo.id, equipo.nombre, equipo.marca, equipo.modelo,
                equipo.numeroSerie, equipo.ubicacion, equipo.numeroInventario]);

            const nombreArchivo = () => {
              const inv = String(equipo.numeroInventario || 'SIN-INV')
                .replace(/[^A-Za-z0-9_-]/g, '');
              return `Etiqueta_${inv}.png`;
            };

            const descargar = () => {
              if (!imgUrl) return;
              const a = document.createElement('a');
              a.href = imgUrl;
              a.download = nombreArchivo();
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            };

            const imprimir = () => {
              if (!imgUrl) return;
              const v = window.open('', '_blank', 'width=900,height=600');
              if (!v) {
                setErrorEtiqueta('El navegador bloqueó la ventana emergente. Permite las ventanas emergentes para imprimir.');
                return;
              }
              // Tamaño físico exacto: la Zebra debe recibir 50x30 mm, sin
              // reescalado del navegador. margin:0 + size fijo evita que el
              // driver aplique "ajustar a página" y deforme la etiqueta.
              v.document.write(
                '<html><head><title>' + nombreArchivo() + '</title>' +
                '<style>' +
                '@page{size:' + ETQ_ANCHO_MM + 'mm ' + ETQ_ALTO_MM + 'mm;margin:0}' +
                'html,body{margin:0;padding:0}' +
                'img{width:' + ETQ_ANCHO_MM + 'mm;height:' + ETQ_ALTO_MM + 'mm;display:block;' +
                'image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}' +
                '</style></head><body>' +
                '<img src="' + imgUrl + '" onload="window.focus();window.print();window.close();">' +
                '</body></html>'
              );
              v.document.close();
            };

            return (
              <div>
                <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                  <p className="text-xs text-gray-400 font-bold uppercase tracking-wider">
                    <i className="fas fa-tag mr-2"></i>Etiqueta de Identificación
                    <span className="ml-2 text-[10px] normal-case font-medium text-gray-400">
                      {ETQ_ANCHO_MM} × {ETQ_ALTO_MM} mm · Zebra 300 dpi
                    </span>
                  </p>
                  <div className="flex flex-wrap gap-2 print-hidden">
                    <button onClick={descargar} disabled={!imgUrl}
                      className="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition shadow-sm font-medium text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                      <i className="fas fa-download"></i> Descargar PNG
                    </button>
                    <button onClick={imprimir} disabled={!imgUrl}
                      className="flex items-center gap-2 bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-800 transition shadow-sm font-medium text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                      <i className="fas fa-print"></i> Imprimir
                    </button>
                  </div>
                </div>

                {errorEtiqueta && (
                  <div className="bg-red-50 border-l-4 border-red-500 p-3 rounded-lg text-sm text-red-700">
                    {errorEtiqueta}
                  </div>
                )}

                <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 flex justify-center shadow-inner">
                  {imgUrl ? (
                    <img src={imgUrl} alt={'Etiqueta ' + (equipo.numeroInventario || '')}
                      className="h-auto rounded shadow-md border border-gray-300 bg-white"
                      style={{ width: '380px', maxWidth: '100%' }} />
                  ) : !errorEtiqueta ? (
                    <div className="py-12 text-gray-400 text-sm flex items-center gap-2">
                      <i className="fas fa-circle-notch fa-spin"></i> Generando etiqueta...
                    </div>
                  ) : null}
                </div>

                <p className="text-[11px] text-gray-400 mt-2 text-center">
                  El código QR dirige a la base de datos de equipos del CMMS.
                  Al imprimir, configura el driver Zebra en <strong>100% de escala</strong> (sin «ajustar a página»).
                </p>
              </div>
            );
          };

          // Banner de diagnóstico: los fallos ya no son silenciosos
          const BannerEstado = () => {
            if (syncError) {
              return (
                <div className="print-hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-lg flex items-start gap-3">
                  <i className="fas fa-triangle-exclamation text-red-600 mt-1"></i>
                  <div className="flex-1">
                    <p className="font-bold text-red-800 text-sm">Error de sincronización</p>
                    <p className="text-red-700 text-sm mt-1">{syncError}</p>
                  </div>
                  <button onClick={() => handleSyncSheets(true)} className="text-sm bg-red-600 text-white px-3 py-1.5 rounded-lg hover:bg-red-700 font-medium whitespace-nowrap">Reintentar</button>
                </div>
              );
            }
            if (equipos.length > 0) {
              return (
                <div className="print-hidden bg-emerald-50 border-l-4 border-emerald-500 p-3 rounded-lg flex items-center gap-3 text-sm">
                  <i className="fas fa-circle-check text-emerald-600"></i>
                  <span className="text-emerald-800 font-medium">
                    {equipos.length} equipos sincronizados{ultimaSync ? ` · ${ultimaSync}` : ''}
                  </span>
                </div>
              );
            }
            return null;
          };

          // ==================================================================
          // [REV-09] MANTENIMIENTOS PREDICTIVOS — lógica
          // ==================================================================
          // Los equipos salen del INVENTARIO (hojas Propio/Comodato/Renta) y
          // solo se consideran los que están EN SERVICIO: un equipo marcado
          // "Fuera de Servicio" (incluida la baja definitiva) no forma parte
          // de la revisión rutinaria. Los registros sin estatus capturado se
          // incluyen para no ocultar equipos por datos incompletos, y el
          // conteo de excluidos se muestra en la cabecera de la tabla.

          const areasPredictivos = useMemo(() => {
            const base = equipos.filter(e =>
              (predOrigen === 'Todos' || e.origen === predOrigen) && !estaFueraServicio(e));
            return Array.from(new Set(base.map(e => e.ubicacion).filter(u => u && u.trim() !== '')))
              .sort((a, b) => a.localeCompare(b, 'es'));
          }, [equipos, predOrigen]);

          // [REV-12] Misma protección para el área guardada de Predictivos.
          useEffect(() => {
            if (!equipos.length || !predArea) return;
            if (!areasPredictivos.includes(predArea)) setPredArea('');
          }, [areasPredictivos, equipos.length]);

          const equiposPredictivos = useMemo(() => {
            if (!predArea) return [];
            return equipos
              .filter(e => e.ubicacion === predArea &&
                           (predOrigen === 'Todos' || e.origen === predOrigen) &&
                           !estaFueraServicio(e))
              .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));
          }, [equipos, predArea, predOrigen]);

          /** Equipos del área excluidos por estar fuera de servicio (informativo). */
          const excluidosPredictivos = useMemo(() => {
            if (!predArea) return [];
            return equipos.filter(e => e.ubicacion === predArea &&
                                       (predOrigen === 'Todos' || e.origen === predOrigen) &&
                                       estaFueraServicio(e));
          }, [equipos, predArea, predOrigen]);

          // Al cambiar de área, propone la frecuencia del programa semanal
          useEffect(() => {
            if (!predArea) return;
            const f = detectarFrecuenciaArea(predArea);
            setPredFrecuencia(f === null ? 'D' : f);
          }, [predArea]);

          // Carga las marcas guardadas del mes+área
          useEffect(() => {
            if (!predArea || !predMes || !usuarioActivo) { setPredDatos({}); return; }
            let cancelado = false;
            (async () => {
              setPredCargando(true);
              try {
                const r = await jsonpConReintentos({ action: 'getPredictivos', mes: predMes, area: predArea });
                if (cancelado) return;
                const mapa = {};
                (r.predictivos || []).forEach(p => { mapa[p.inventario] = { dias: p.dias || {}, obs: p.obs || '' }; });
                setPredDatos(mapa);
              } catch (err) {
                if (cancelado) return;
                if (esAccesoDenegado(err)) { cerrarSesion(); return; }
                setSyncError('No se pudieron cargar las revisiones: ' + err.message);
              } finally {
                if (!cancelado) setPredCargando(false);
              }
            })();
            return () => { cancelado = true; };
          }, [predArea, predMes, usuarioActivo]);

          const guardarPredictivo = (equipo, cambios) => jsonpConReintentos({
            action: 'save',
            payload: JSON.stringify({
              action: 'predictivo',
              mes: predMes,
              area: predArea,
              data: {
                inventario: equipo.numeroInventario,
                nombre: equipo.nombre || '',
                marca: equipo.marca || '',
                modelo: equipo.modelo || '',
                serie: equipo.numeroSerie || '',
                ...cambios
              }
            })
          });

          /** Clic en una celda-día: vacío -> ✓ OK -> ✗ Falla -> vacío. */
          const ciclarMarcaPredictivo = (equipo, dia) => {
            const inv = equipo.numeroInventario;
            if (!inv) { setSyncError('El equipo no tiene número de inventario; no se puede registrar su revisión.'); return; }
            const actual = ((predDatos[inv] || {}).dias || {})[dia] || '';
            const siguiente = actual === '' ? 'OK' : (actual === 'OK' ? 'F' : '');
            const previo = predDatos;
            // Optimista: se marca de inmediato y se revierte si falla el guardado
            setPredDatos(prev => {
              const fila = prev[inv] || { dias: {}, obs: '' };
              const dias = { ...fila.dias };
              if (siguiente) dias[dia] = siguiente; else delete dias[dia];
              return { ...prev, [inv]: { ...fila, dias } };
            });
            guardarPredictivo(equipo, { dia, valor: siguiente }).catch(err => {
              setPredDatos(previo);
              if (esAccesoDenegado(err)) { cerrarSesion(); return; }
              setSyncError('No se guardó la marca de revisión: ' + err.message);
            });
          };

          const editarObsPredictivo = (inv, texto) => {
            setPredDatos(prev => ({ ...prev, [inv]: { dias: (prev[inv] || {}).dias || {}, obs: texto } }));
          };

          const guardarObsPredictivo = (equipo, texto) => {
            if (!equipo.numeroInventario) return;
            guardarPredictivo(equipo, { obs: texto }).catch(err => {
              if (esAccesoDenegado(err)) { cerrarSesion(); return; }
              setSyncError('No se guardó la observación: ' + err.message);
            });
          };

          // ==================================================================
          // [NEW-31] PROVEEDORES — carga, importación y cálculo
          // ==================================================================

          const cargarProveedores = async () => {
            if (!usuarioActivo) return;
            setProvCargando(true);
            try {
              const r = await jsonpConReintentos({
                action: 'getProveedores', desde: provDesde, hasta: provHasta
              });
              setProvMovs(r.movimientos || []);
              setProvCirugias(r.cirugias || []);
              setProvHojas({
                proveedores: r.hojaProveedores !== false,
                quirurgica: r.hojaQuirurgica !== false
              });
            } catch (err) {
              if (esAccesoDenegado(err)) { cerrarSesion(); return; }
              setSyncError('No se pudieron cargar los movimientos de proveedores: ' + mensajeAmigable(err));
            } finally {
              setProvCargando(false);
            }
          };

          useEffect(() => {
            if (activeTab !== 'proveedores' || !usuarioActivo) return;
            cargarProveedores();
          }, [activeTab, provDesde, provHasta, usuarioActivo]);

          /** Lee el Excel y arma la vista previa. Nada se envía todavía. */
          const leerArchivoQuirurgico = (file) => {
            if (!file) return;
            setImpError(null); setImpEstado(null); setImpPrevia(null);
            setImpArchivo(file.name);
            const lector = new FileReader();
            lector.onload = (ev) => {
              try {
                const res = procesarExcelQuirurgico(new Uint8Array(ev.target.result));
                if (res.error) { setImpError(res.error); return; }
                if (!res.filas.length) { setImpError('No se encontró ninguna cirugía con fecha válida.'); return; }
                setImpPrevia(res);
              } catch (e) {
                setImpError('No se pudo leer el archivo: ' + e.message);
              }
            };
            lector.onerror = () => setImpError('No se pudo abrir el archivo.');
            lector.readAsArrayBuffer(file);
          };

          /**
           * Envía la programación en bloques. JSONP viaja por GET y la URL
           * tiene un límite práctico de unos pocos KB, así que un día con 40
           * cirugías no cabe en una sola petición.
           * El primer bloque va en modo 'reemplazar': borra esas fechas para
           * que reimportar una programación corregida sustituya en vez de
           * duplicar.
           */
          const importarProgramacion = async () => {
            if (!impPrevia) return;
            // 8 filas por petición. Medido con la programación real: cada
            // procedimiento aporta ~410 caracteres a la URL (procedimiento,
            // cirujano, material y proveedor son textos largos), así que 8
            // deja la petición cerca de 3.5 KB, con margen frente al límite
            // práctico de las URL de Apps Script.
            const TAM = 8;
            const total = impPrevia.filas.length;
            setImpError(null);
            setImpEstado({ texto: 'Preparando...', progreso: 0 });
            try {
              let enviadas = 0;
              for (let i = 0; i < total; i += TAM) {
                const bloque = impPrevia.filas.slice(i, i + TAM);
                await jsonpEscrituraUnica({
                  action: 'save',
                  payload: JSON.stringify({
                    action: 'importarQuirurgica',
                    modo: i === 0 ? 'reemplazar' : 'agregar',
                    fechas: i === 0 ? impPrevia.fechas : [],
                    filas: bloque,
                    archivo: impArchivo
                  })
                });
                enviadas += bloque.length;
                setImpEstado({
                  texto: `Enviando ${enviadas} de ${total} cirugías...`,
                  progreso: Math.round((enviadas / total) * 100)
                });
              }
              setImpEstado({ texto: `${total} procedimientos importados.`, progreso: 100 });
              setImpPrevia(null);
              setImpAbierto(false);
              if (archivoRef.current) archivoRef.current.value = '';
              // Encuadra el rango en las fechas recién importadas
              if (impPrevia.fechas.length) {
                setProvDesde(impPrevia.fechas[0]);
                setProvHasta(impPrevia.fechas[impPrevia.fechas.length - 1]);
              } else {
                cargarProveedores();
              }
            } catch (err) {
              if (esAccesoDenegado(err)) { cerrarSesion(); return; }
              setImpEstado(null);
              setImpError('La importación se interrumpió: ' + mensajeAmigable(err) +
                ' Revisa la hoja Quirurgica: puede haber quedado a medias.');
            }
          };

          /**
           * Visitas emparejadas y cruzadas con la programación.
           *
           * El backend devuelve una ventana más amplia que la visible (±14
           * días) para poder cerrar visitas cuya salida cae en otro día. El
           * emparejado se hace sobre TODA esa ventana y solo después se
           * recorta a lo que el usuario pidió ver, usando la fecha del
           * ingreso (o la de la salida, si es una salida huérfana).
           */
          const provCruce = useMemo(() => {
            const todas = emparejarVisitas(provMovs);
            const enRango = todas.filter(v => {
              const ref = v.selloIngreso ? v.fecha : v.fechaSalida;
              return ref >= provDesde && ref <= provHasta;
            });
            return cruzarProveedores(enRango, provCirugias);
          }, [provMovs, provCirugias, provDesde, provHasta]);

          const provVisitasFiltradas = useMemo(() => {
            const q = normTexto(busquedaProveedores);
            return provCruce.visitas.filter(v => {
              const coincide = !q ||
                normTexto(v.empresa).includes(q) ||
                normTexto(v.medico).includes(q) ||
                normTexto(v.area).includes(q);
              const alerta = provFiltroAlerta === 'Todas' ||
                (provFiltroAlerta === 'Sin alertas' ? v.alertas.length === 0
                                                    : v.alertas.includes(provFiltroAlerta));
              return coincide && alerta;
            });
          }, [provCruce, busquedaProveedores, provFiltroAlerta]);

          const [soloPendientes, setSoloPendientes] = useState(false);

          /** Programación visible en la tabla de cruce. */
          const cirugiasVisibles = useMemo(() => {
            const lista = provCruce.cirugiasConEstado || [];
            return (soloPendientes ? lista.filter(c => c.estado === 'SIN_PROVEEDOR') : lista)
              .slice()
              .sort((a, b) => (a.fecha + (a.hora || '99:99')).localeCompare(b.fecha + (b.hora || '99:99')));
          }, [provCruce, soloPendientes]);

          /** Qué programación hay cargada, para mostrarlo sin volver a subir nada. */
          const provResumenProgramacion = useMemo(() => ({
            servicios: [...new Set(provCirugias.map(c => c.servicio).filter(Boolean))],
            archivo: (provCirugias.find(c => c.archivo) || {}).archivo || '',
            fechas: [...new Set(provCirugias.map(c => c.fecha))].sort()
          }), [provCirugias]);

          /** Indicadores del rango seleccionado. */
          const provIndicadores = useMemo(() => {
            const v = provCruce.visitas;
            const conIngreso = v.filter(x => x.horaIngreso);
            const conCx      = conIngreso.filter(x => x.cirugia);
            // [REV-12] La puntualidad se evalúa sobre la línea de tiempo
            // completa y solo en los ingresos que tienen una referencia de
            // inicio (programación o formulario), con margen de cortesía.
            const conRef      = conIngreso.filter(x => x.retraso !== null);
            const puntuales   = conRef.filter(x => x.retraso <= TOLERANCIA_LLEGADA_MIN);
            const anticipados = conRef.filter(x => x.retraso < 0);

            const medianaDe = (arr) => {
              const a = arr.slice().sort((x, y) => x - y);
              if (!a.length) return null;
              return a.length % 2
                ? a[(a.length - 1) / 2]
                : Math.round((a[a.length / 2 - 1] + a[a.length / 2]) / 2);
            };
            const mediana = medianaDe(v.filter(x => x.permanencia !== null).map(x => x.permanencia));
            const medianaOperativa = medianaDe(
              v.filter(x => x.permanenciaOperativa !== null && x.permanenciaOperativa !== undefined)
               .map(x => x.permanenciaOperativa));

            const porEmpresa = {};
            conIngreso.forEach(x => {
              const k = normEmpresa(x.empresa) || '(sin empresa)';
              porEmpresa[k] = (porEmpresa[k] || 0) + 1;
            });
            const porDia = {};
            conIngreso.forEach(x => { porDia[x.fecha] = (porDia[x.fecha] || 0) + 1; });

            const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
            return {
              totalVisitas: v.length,
              ingresos: conIngreso.length,
              empresas: Object.keys(porEmpresa).length,
              conProgramacion: conCx.length,
              pctProgramacion: pct(conCx.length, conIngreso.length),
              puntuales: puntuales.length,
              anticipados: anticipados.length,
              evaluables: conRef.length,
              pctPuntualidad: pct(puntuales.length, conRef.length),
              sinSalida: v.filter(x => x.alertas.includes('SIN_SALIDA')).length,
              permanenciaMediana: mediana,
              permanenciaOperativaMediana: medianaOperativa,
              cirugiasSinProveedor: provCruce.cirugiasSinProveedor.length,
              cirugiasTotales: provCirugias.length,
              topEmpresas: Object.entries(porEmpresa).sort((a,b) => b[1]-a[1]).slice(0,6),
              porDia: Object.entries(porDia).sort((a,b) => a[0].localeCompare(b[0]))
            };
          }, [provCruce, provCirugias]);

          /**
           * [REV-12 · MEJORA 5] Exporta el módulo de proveedores según la vista
           * activa. La bitácora sale con los tiempos ya calculados (total,
           * espera y operativa) para poder analizarlos fuera del sistema.
           */
          const exportarProveedores = () => {
            const rango = provDesde === provHasta ? provDesde : provDesde + '_a_' + provHasta;
            const etiquetas = (v) => v.alertas.map(a => (ETIQUETAS_ALERTA[a] || {}).txt || a).join(' · ');

            const hojaVisitas = () => {
              const filas = [[
                'FECHA OPERATIVA', 'EMPRESA', 'MÉDICO SOLICITANTE', 'ÁREA DESTINO',
                'PROCEDIMIENTO (FECHA)', 'PROCEDIMIENTO (HORA)',
                'INGRESO (FECHA)', 'INGRESO (HORA)', 'SALIDA (FECHA)', 'SALIDA (HORA)',
                'PERMANENCIA TOTAL (MIN)', 'ESPERA PREVIA (MIN)', 'PERMANENCIA OPERATIVA (MIN)',
                'DIFERENCIA VS INICIO (MIN)', 'REFERENCIA', 'CIRUGÍA CRUZADA', 'OBSERVACIONES'
              ]];
              provVisitasFiltradas.forEach(v => {
                filas.push([
                  v.fecha || '', v.empresa || '', v.medico || '', v.area || '',
                  v.fechaProcedimiento || '', v.horaProcedimiento || '',
                  v.fechaIngresoReal || '', v.horaIngreso || '',
                  v.fechaSalida || '', v.horaSalida || '',
                  v.permanencia === null || v.permanencia === undefined ? '' : v.permanencia,
                  v.espera || 0,
                  v.permanenciaOperativa === null || v.permanenciaOperativa === undefined ? '' : v.permanenciaOperativa,
                  v.retraso === null || v.retraso === undefined ? '' : v.retraso,
                  v.referenciaRetraso || '',
                  v.cirugia ? (v.cirugia.procedimiento || '') : '',
                  etiquetas(v)
                ]);
              });
              return { nombre: 'Bitácora', filas,
                       anchos: [14, 22, 26, 18, 14, 12, 14, 12, 14, 12, 14, 14, 16, 16, 14, 34, 34] };
            };

            const hojaProgramacion = () => {
              const filas = [['FECHA', 'HORA', 'SERVICIO', 'PROCEDIMIENTO', 'CIRUJANO',
                              'CASA COMERCIAL', 'ESTADO', 'PROVEEDOR QUE INGRESÓ', 'HORA DE INGRESO']];
              (provCruce.cirugiasConEstado || []).forEach(c => {
                filas.push([
                  c.fecha || '', c.hora || '', c.servicio || '', c.procedimiento || '',
                  c.cirujano || '', c.empresa || '',
                  (ESTADOS_CIRUGIA[c.estado] || {}).txt || c.estado,
                  c.visita ? (c.visita.empresa || '') : '',
                  c.visita ? (c.visita.horaIngreso || '') : ''
                ]);
              });
              return { nombre: 'Programación', filas,
                       anchos: [12, 8, 18, 40, 30, 22, 20, 22, 14] };
            };

            const hojaIndicadores = () => ({
              nombre: 'Indicadores',
              anchos: [46, 18],
              filas: [
                ['Indicadores de Control de Proveedores · HSAIP-FOR-INB-022'],
                ['Periodo', provDesde === provHasta ? provDesde : provDesde + ' al ' + provHasta],
                [],
                ['Visitas totales registradas', provIndicadores.totalVisitas],
                ['Ingresos registrados', provIndicadores.ingresos],
                ['Empresas distintas', provIndicadores.empresas],
                ['Ingresos con cirugía programada', provIndicadores.conProgramacion],
                ['% con programación', provIndicadores.pctProgramacion],
                ['Ingresos evaluables en puntualidad', provIndicadores.evaluables],
                ['Ingresos puntuales', provIndicadores.puntuales],
                ['Ingresos anticipados', provIndicadores.anticipados],
                ['% de puntualidad', provIndicadores.pctPuntualidad],
                ['Permanencia mediana (min)', provIndicadores.permanenciaMediana],
                ['Permanencia operativa mediana (min)', provIndicadores.permanenciaOperativaMediana],
                ['Visitas sin salida registrada', provIndicadores.sinSalida],
                ['Cirugías programadas', provIndicadores.cirugiasTotales],
                ['Cirugías sin proveedor registrado', provIndicadores.cirugiasSinProveedor],
                [],
                ['Generado por', usuarioActivo || ''],
                ['Fecha de generación', new Date().toLocaleString('es-MX')]
              ]
            });

            if (provVista === 'cruce') {
              exportarExcel('Proveedores_Cruce_' + rango, [hojaProgramacion(), hojaVisitas(), hojaIndicadores()]);
            } else if (provVista === 'indicadores') {
              exportarExcel('Proveedores_Indicadores_' + rango, [hojaIndicadores(), hojaVisitas()]);
            } else {
              exportarExcel('Proveedores_Bitacora_' + rango, [hojaVisitas(), hojaIndicadores()]);
            }
          };

          // ==================================================================
          // [REV-13] ÓRDENES DE SERVICIO — carga, filtrado e indicadores
          // ==================================================================
          const cargarOrdenes = async () => {
            if (!usuarioActivo) return;
            setOrdCargando(true);
            try {
              const r = await jsonpConReintentos({
                action: 'getOrdenes', desde: ordDesde, hasta: ordHasta
              });
              setOrdDatos(r.ordenes || []);
              setOrdHojaExiste(r.hojaExiste !== false);
              setOrdLectura({
                filasLeidas: r.filasLeidas || 0,
                filasTotales: r.filasTotales || 0,
                parcial: !!r.lecturaParcial
              });
            } catch (err) {
              if (esAccesoDenegado(err)) { cerrarSesion(); return; }
              setSyncError('No se pudieron cargar las órdenes de servicio: ' + mensajeAmigable(err));
            } finally {
              setOrdCargando(false);
            }
          };

          useEffect(() => {
            if (activeTab !== 'ordenes' || !usuarioActivo) return;
            cargarOrdenes();
          }, [activeTab, ordDesde, ordHasta, usuarioActivo]);

          /** Valores presentes en los datos cargados, para poblar los selectores.
           *  Se calculan de lo que realmente llegó, no de un catálogo fijo: si el
           *  formulario cambia de opciones, los filtros se adaptan solos. */
          const ordCatalogos = useMemo(() => {
            const unicos = (campo) => Array.from(
              new Set(ordDatos.map(o => String(o[campo] || '').trim()).filter(Boolean))
            ).sort((a, b) => a.localeCompare(b, 'es'));
            return {
              areas: unicos('area'),
              tipos: unicos('tipoServicio'),
              empresas: unicos('empresa'),
              frecuencias: unicos('frecuencia'),
              reporta: unicos('reporta')
            };
          }, [ordDatos]);

          const ordFiltradas = useMemo(() => {
            const q = normTexto(busquedaOrdenes);
            const f = ordFiltros;

            const coincideSiNo = (valor, filtro) => {
              if (filtro === 'Todos') return true;
              if (filtro === 'Sin dato') return !valor;
              return valor === filtro;   // 'SI' | 'NO'
            };

            const lista = ordDatos.filter(o => {
              if (f.area !== 'Todas' && o.area !== f.area) return false;
              if (f.tipo !== 'Todos' && o.tipoServicio !== f.tipo) return false;
              if (f.empresa !== 'Todas' && o.empresa !== f.empresa) return false;
              if (f.frecuencia !== 'Todas' && o.frecuencia !== f.frecuencia) return false;
              if (f.reporta !== 'Todos' && o.reporta !== f.reporta) return false;

              if (!coincideSiNo(o.falloConPaciente, f.falloPaciente)) return false;
              if (!coincideSiNo(o.danoPaciente, f.danoPaciente)) return false;
              if (!coincideSiNo(o.validacion, f.validacion)) return false;
              if (!coincideSiNo(o.apto, f.apto)) return false;

              if (f.refacciones === 'Con refacciones' && !o.refacciones.length) return false;
              if (f.refacciones === 'Sin refacciones' && o.refacciones.length) return false;

              if (f.firmas === 'Completas' && !(o.firmaBio && o.firmaArea)) return false;
              if (f.firmas === 'Incompletas' && (o.firmaBio && o.firmaArea)) return false;

              if (!q) return true;
              // La búsqueda libre recorre identificación del equipo, folios,
              // personas y el texto capturado del servicio.
              const heno = normTexto([
                o.idUnico, o.numOrden, o.numReporte, o.equipo, o.marca, o.modelo, o.serie,
                o.inventario, o.area, o.reporta, o.responsableBio, o.responsableArea,
                o.ingServicio, o.empresa, o.fallaReportada, o.descripcion,
                o.observaciones, o.recomendacion, o.tipoServicio,
                o.refacciones.map(r => r.descripcion + ' ' + r.parte).join(' ')
              ].join(' '));
              return heno.indexOf(q) > -1;
            });

            const texto = (v) => String(v || '');
            // [REV-15] Se ordena por la fecha de término del servicio, que es
            // la que ahora encabeza la tabla y la que define el periodo.
            const clave = (o) => texto((o.fechaServicio || o.fechaInicio) + (o.horaFin || o.horaInicio));
            const cmp = {
              fecha_desc: (a, b) => clave(b).localeCompare(clave(a)),
              fecha_asc:  (a, b) => clave(a).localeCompare(clave(b)),
              area:       (a, b) => texto(a.area).localeCompare(texto(b.area), 'es'),
              equipo:     (a, b) => texto(a.equipo).localeCompare(texto(b.equipo), 'es'),
              duracion:   (a, b) => (b.duracionMin === null ? -1 : b.duracionMin) - (a.duracionMin === null ? -1 : a.duracionMin)
            };
            return lista.slice().sort(cmp[ordOrden] || cmp.fecha_desc);
          }, [ordDatos, busquedaOrdenes, ordFiltros, ordOrden]);

          const ordIndicadores = useMemo(() => {
            const v = ordFiltradas;
            const n = v.length;
            const pct = (x, t) => (t ? Math.round((x / t) * 100) : 0);
            const cuenta = (fn) => v.filter(fn).length;

            const duraciones = v.filter(o => o.duracionMin !== null && o.duracionMin >= 0)
                                .map(o => o.duracionMin).sort((a, b) => a - b);
            const mediana = duraciones.length
              ? (duraciones.length % 2
                  ? duraciones[(duraciones.length - 1) / 2]
                  : Math.round((duraciones[duraciones.length / 2 - 1] + duraciones[duraciones.length / 2]) / 2))
              : null;

            // Órdenes con validación exigible: las que declararon algo en el campo.
            const conValidacion = cuenta(o => o.validacion === 'SI' || o.validacion === 'NO');
            const validadas = cuenta(o => o.validacion === 'SI');

            // Distribución por tipo de servicio, para la vista de indicadores.
            const porTipo = {};
            v.forEach(o => {
              const t = o.tipoServicio || 'Sin clasificar';
              porTipo[t] = (porTipo[t] || 0) + 1;
            });

            return {
              total: n,
              equipos: new Set(v.map(o => o.inventario).filter(Boolean)).size,
              areas: new Set(v.map(o => o.area).filter(Boolean)).size,
              falloConPaciente: cuenta(o => o.falloConPaciente === 'SI'),
              pctFalloConPaciente: pct(cuenta(o => o.falloConPaciente === 'SI'), n),
              danoPaciente: cuenta(o => o.danoPaciente === 'SI'),
              validadas: validadas,
              conValidacion: conValidacion,
              pctValidacion: pct(validadas, conValidacion),
              noAptos: cuenta(o => o.apto === 'NO'),
              sinCerrar: cuenta(o => !o.fechaFin),
              conRefacciones: cuenta(o => o.refacciones.length > 0),
              sinFirma: cuenta(o => !o.firmaBio || !o.firmaArea),
              duracionMediana: mediana,
              porTipo: Object.keys(porTipo).sort((a, b) => porTipo[b] - porTipo[a])
                             .map(t => ({ tipo: t, n: porTipo[t], pct: pct(porTipo[t], n) }))
            };
          }, [ordFiltradas]);

          /** Exporta las órdenes filtradas: una hoja con el detalle plano, otra
           *  con las refacciones desglosadas (una fila por refacción, que es lo
           *  que sirve para costeo) y una de indicadores. */
          const exportarOrdenes = () => {
            const rango = ordDesde === ordHasta ? ordDesde : ordDesde + '_a_' + ordHasta;

            const filas = [[
              'ID ÚNICO', 'FECHA DEL SERVICIO',
              'N° ORDEN', 'N° REPORTE', 'FECHA INICIO', 'HORA INICIO', 'FECHA FIN', 'HORA FIN',
              'DURACIÓN (MIN)', 'ÁREA', 'REPORTA', 'TIPO DE SERVICIO', 'FRECUENCIA',
              'EQUIPO', 'MARCA', 'MODELO', 'N° SERIE', 'N° INVENTARIO', 'FECHA INSTALACIÓN',
              'CONDICIONES', 'FALLÓ CON PACIENTE', 'DAÑO A PACIENTE', 'CUMPLE VALIDACIÓN',
              'APTO PARA PACIENTE', 'FALLA REPORTADA', 'DESCRIPCIÓN DEL SERVICIO',
              'OBSERVACIONES', 'RECOMENDACIÓN DE FABRICANTE', 'REFACCIONES',
              'RESPONSABLE BIOMÉDICA', 'RESPONSABLE DEL ÁREA', 'FIRMA BIOMÉDICA', 'FIRMA ÁREA',
              'EMPRESA', 'ING. SERVICIO', 'CONTACTO', 'PÓLIZA', 'IQ', 'OQ', 'PQ',
              'OBSERVACIONES IQ/OQ/PQ', 'CALIFICACIÓN DEL SERVICIO', 'FECHA DEL REPORTE'
            ]];
            ordFiltradas.forEach(o => {
              filas.push([
                o.idUnico, o.fechaServicio,
                o.numOrden, o.numReporte, o.fechaInicio, o.horaInicio, o.fechaFin, o.horaFin,
                o.duracionMin === null ? '' : o.duracionMin,
                o.area, o.reporta, o.tipoServicio, o.frecuencia,
                o.equipo, o.marca, o.modelo, o.serie, o.inventario, o.fechaInstalacion,
                o.condiciones, o.falloConPaciente, o.danoPaciente, o.validacion, o.apto,
                o.fallaReportada, o.descripcion, o.observaciones, o.recomendacion,
                o.refacciones.map(r => [r.cantidad, r.descripcion, r.parte].filter(Boolean).join(' ')).join(' | '),
                o.responsableBio, o.responsableArea, o.firmaBio ? 'SI' : 'NO', o.firmaArea ? 'SI' : 'NO',
                o.empresa, o.ingServicio, o.contacto, o.poliza, o.iq, o.oq, o.pq,
                o.observacionesIQ, o.calificacion, o.fechaReporte
              ]);
            });

            const refFilas = [['ID ÚNICO', 'N° ORDEN', 'FECHA', 'ÁREA', 'EQUIPO', 'N° INVENTARIO',
                               'CANTIDAD', 'DESCRIPCIÓN', 'N° DE PARTE', 'N° DE SERIE']];
            ordFiltradas.forEach(o => o.refacciones.forEach(r => {
              refFilas.push([o.idUnico, o.numOrden, o.fechaServicio, o.area, o.equipo, o.inventario,
                             r.cantidad, r.descripcion, r.parte, r.serie]);
            }));

            const valFilas = [['ID ÚNICO', 'N° ORDEN', 'FECHA', 'EQUIPO', 'N° INVENTARIO',
                               'COLUMNA 1', 'COLUMNA 2', 'COLUMNA 3', 'COLUMNA 4']];
            ordFiltradas.forEach(o => (o.valoresReferencia || []).forEach(r => {
              valFilas.push([o.idUnico, o.numOrden, o.fechaServicio, o.equipo, o.inventario, r[0], r[1], r[2], r[3]]);
            }));

            const indFilas = [
              ['Indicadores de Órdenes de Servicio'],
              ['Periodo', ordDesde === ordHasta ? ordDesde : ordDesde + ' al ' + ordHasta],
              ['Filtros aplicados', descripcionFiltrosOrd()],
              [],
              ['Órdenes de servicio', ordIndicadores.total],
              ['Equipos distintos atendidos', ordIndicadores.equipos],
              ['Áreas atendidas', ordIndicadores.areas],
              ['Eventos con falla estando conectado a paciente', ordIndicadores.falloConPaciente],
              ['% de eventos con paciente', ordIndicadores.pctFalloConPaciente],
              ['Eventos con daño a paciente', ordIndicadores.danoPaciente],
              ['Órdenes que declararon validación', ordIndicadores.conValidacion],
              ['Órdenes que cumplen validación', ordIndicadores.validadas],
              ['% de cumplimiento de validación', ordIndicadores.pctValidacion],
              ['Equipos declarados NO aptos para paciente', ordIndicadores.noAptos],
              ['Órdenes sin fecha de fin', ordIndicadores.sinCerrar],
              ['Órdenes con refacciones', ordIndicadores.conRefacciones],
              ['Órdenes con firma incompleta', ordIndicadores.sinFirma],
              ['Duración mediana del servicio (min)', ordIndicadores.duracionMediana],
              [],
              ['DISTRIBUCIÓN POR TIPO DE SERVICIO', 'ÓRDENES', '%']
            ];
            ordIndicadores.porTipo.forEach(t => indFilas.push([t.tipo, t.n, t.pct]));
            indFilas.push([], ['Generado por', usuarioActivo || ''],
                          ['Fecha de generación', new Date().toLocaleString('es-MX')]);

            exportarExcel('Ordenes_Servicio_' + rango, [
              { nombre: 'Órdenes', filas, anchos: [20, 16, 16, 14, 13, 11, 13, 11, 14, 20, 24, 24, 14, 32, 18, 18, 20, 16, 16, 24, 18, 18, 18, 18, 42, 46, 40, 34, 46, 28, 28, 14, 12, 26, 24, 18, 16, 14, 14, 14, 34, 20, 14] },
              { nombre: 'Refacciones', filas: refFilas, anchos: [20, 16, 13, 20, 32, 16, 10, 40, 18, 18] },
              { nombre: 'Valores de referencia', filas: valFilas, anchos: [20, 16, 13, 32, 16, 22, 22, 22, 22] },
              { nombre: 'Indicadores', filas: indFilas, anchos: [46, 16, 10] }
            ]);
          };

          /** Resumen legible de los filtros activos: se imprime en el encabezado
           *  del formato y se guarda en la hoja de indicadores del Excel, para que
           *  el reporte diga siempre de qué universo salió. */
          const descripcionFiltrosOrd = () => {
            const f = ordFiltros;
            const partes = [];
            if (busquedaOrdenes) partes.push('Texto: "' + busquedaOrdenes + '"');
            if (f.area !== 'Todas') partes.push('Área: ' + f.area);
            if (f.tipo !== 'Todos') partes.push('Tipo: ' + f.tipo);
            if (f.empresa !== 'Todas') partes.push('Empresa: ' + f.empresa);
            if (f.frecuencia !== 'Todas') partes.push('Frecuencia: ' + f.frecuencia);
            if (f.reporta !== 'Todos') partes.push('Reporta: ' + f.reporta);
            if (f.falloPaciente !== 'Todos') partes.push('Falló con paciente: ' + f.falloPaciente);
            if (f.danoPaciente !== 'Todos') partes.push('Daño a paciente: ' + f.danoPaciente);
            if (f.validacion !== 'Todos') partes.push('Validación: ' + f.validacion);
            if (f.apto !== 'Todos') partes.push('Apto: ' + f.apto);
            if (f.refacciones !== 'Todos') partes.push(f.refacciones);
            if (f.firmas !== 'Todas') partes.push('Firmas: ' + f.firmas);
            return partes.length ? partes.join(' · ') : 'Sin filtros (todas las órdenes del periodo)';
          };

          const ordFiltrosActivos = () =>
            descripcionFiltrosOrd() !== 'Sin filtros (todas las órdenes del periodo)';

          // ==================================================================
          // [NEW-31] PROVEEDORES — vista
          // ==================================================================
          const BadgeAlerta = ({ codigo }) => {
            const a = ETIQUETAS_ALERTA[codigo];
            if (!a) return null;
            return <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${a.clase} whitespace-nowrap`}>{a.txt}</span>;
          };

          const TarjetaKPI = ({ icono, valor, etiqueta, detalle, color }) => (
            <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-4">
              <div className="flex items-center gap-2 mb-2">

                <span className="text-[11px] font-bold uppercase tracking-wider text-gray-500">{etiqueta}</span>
              </div>
              <p className="text-2xl font-bold text-slate-800">{valor}</p>
              {detalle && <p className="text-xs text-gray-500 mt-1">{detalle}</p>}
            </div>

          const renderProveedores = () => {

                  <div>
                    <h2 className="text-2xl font-bold text-slate-800">Ingreso y Salida de Proveedores</h2>
                    <p className="text-sm text-gray-500 mt-1">
                      Registro del formulario de vigilancia cruzado con la programación quirúrgica
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={cargarProveedores} disabled={provCargando}
                      className="flex items-center gap-2 bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition shadow-sm font-medium text-sm disabled:opacity-50">
                      <i className={`fas fa-sync-alt ${provCargando ? 'fa-spin' : ''}`}></i> Actualizar
                    </button>
                    <button onClick={exportarProveedores} disabled={provCargando || provCruce.visitas.length === 0}
                      className="flex items-center gap-2 bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 transition shadow-sm font-medium text-sm disabled:opacity-40">
                      <i className="fas fa-file-excel"></i> Exportar
                    </button>
                    <button onClick={() => window.print()}
                      className="flex items-center gap-2 bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-800 transition shadow-sm font-medium text-sm">
                      <i className="fas fa-print"></i> Imprimir
                    </button>
                  </div>
                </div>

                {/* Avisos de configuración */}
                {!provHojas.proveedores && (
                  <div className="print-hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-lg text-sm">
                    <p className="font-bold text-amber-900">Falta la hoja "Proveedores"</p>

                    <input type="date" value={provDesde} onChange={(e) => {
                      setProvDesde(e.target.value);
                      if (e.target.value > provHasta) setProvHasta(e.target.value);
                    }} className="px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1">Hasta</label>
                    <input type="date" value={provHasta} onChange={(e) => setProvHasta(e.target.value)}
                      className="px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50" />
                  </div>
                  <button onClick={() => { setProvDesde(hoyISO()); setProvHasta(hoyISO()); }}
                    className="px-3 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50 rounded-lg">Hoy</button>
                  <div className="flex-1"></div>
                  <div className="flex gap-1 bg-gray-100 p-1 rounded-lg">
                    {[['bitacora','Bitácora','fa-list'],['cruce','Cruce con quirófano','fa-code-compare'],['indicadores','Indicadores','fa-chart-simple']].map(([id,txt,ic]) => (
                      <button key={id} onClick={() => setProvVista(id)}
                        className={`px-3 py-1.5 rounded-md text-sm font-medium transition ${provVista===id ? 'bg-white shadow-sm text-blue-700' : 'text-gray-600 hover:text-gray-900'}`}>
                        <i className={`fas ${ic} mr-1.5`}></i>{txt}
                      </button>
                    ))}
                  </div>
                </div>

                {provCargando && (
                  <div className="print-hidden bg-white rounded-xl border border-gray-100 p-8 text-center text-gray-500">
                    <i className="fas fa-circle-notch fa-spin text-2xl text-blue-500 mb-2"></i>
                    <p className="text-sm">Consultando movimientos...</p>

                {/* ---------------- BITÁCORA ---------------- */}
                {!provCargando && provVista === 'bitacora' && (

                        <input type="text" value={provBusqueda} onChange={(e) => setProvBusqueda(e.target.value)}

                      </div>
                      <select value={provFiltroAlerta} onChange={(e) => setProvFiltroAlerta(e.target.value)}
                        className="px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 font-medium">
                        <option value="Todas">Todas las visitas</option>
                        <option value="Sin alertas">Sin alertas</option>

                      </span>
                    </div>

                    <div className="hidden print-block p-4 text-slate-800">
                      <MembreteHSAIP
                        titulo="Bitácora de Ingreso y Salida de Proveedores"
                        codigo="HSAIP-FOR-INB-022 Rev. 01"
                        campos={[['PERIODO', rangoTexto], ['REGISTROS', String(provVisitasFiltradas.length)]]}
                      />
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                      <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left">
                          <thead className="bg-gray-50 text-[11px] uppercase tracking-wider text-gray-500 font-bold">
                            <tr>
                              <th className="px-4 py-3">Fecha</th>

                          <tbody className="divide-y divide-gray-100">
                            {provVisitasFiltradas.length === 0 ? (

                  </>

                      </div>

                      {impAbierto && (

            const malo = invertir ? valor === 'SI' : valor === 'NO';
            return (

                      Google Sheets y verifica que la hoja destino se llame exactamente
                      <strong> Form Responses</strong>. Si tiene otro nombre, ajusta
                      <strong> HOJA_ORDENES</strong> en Codigo.gs.
                    </p>
                  </div>
                )}

                {/* ---------------------------------------------------------

                    --------------------------------------------------------- */}
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 print-hidden">

                        <tbody className="divide-y divide-gray-100">
