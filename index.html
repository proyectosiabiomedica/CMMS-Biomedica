                if (v.salidaOtroDia) alertas.push('SALIDA_OTRO_DIA');
                if (permanenciaVigilada !== null && permanenciaVigilada > UMBRAL_PERMANENCIA_MIN) alertas.push('PERMANENCIA_LARGA');
              }
            }

            return { ...v, cirugia: cx, señalesCruce: señales, retraso, referenciaRetraso, permanenciaVigilada, alertas };
          });

          // Estado de CADA cirugía programada, no solo de las que quedaron sin
          // proveedor: la vista de cruce debe mostrar la programación completa
          // del día para que sirva como lista de verificación.
          const cirugiasConEstado = cirugias.map(c => {
            // Visitas que cruzaron exactamente con esta cirugía
            const directas = visitasCruzadas.filter(v =>
              v.horaIngreso && v.cirugia && v.cirugia.fila === c.fila);
            // Visitas de la misma casa comercial que cruzaron con otra cirugía
            // del día: el representante sí está en el hospital.
            const mismaCasa = visitasCruzadas.filter(v =>
              v.horaIngreso && c.empresa && v.empresa && mismaEmpresa(v.empresa, c.empresa));

            let estado, visita = null;
            if (!c.empresa) {
              estado = 'NO_REQUIERE';
            } else if (directas.length) {
              estado = 'PRESENTE';
              visita = directas[0];
            } else if (mismaCasa.length) {
              estado = 'CASA_PRESENTE';
              visita = mismaCasa[0];
            } else {
              estado = 'SIN_PROVEEDOR';
            }
            return { ...c, estado, visita, ingresos: directas.length || mismaCasa.length };
          });

          // Cirugías cuya casa comercial no registró NINGÚN ingreso ese día.
          // Se compara por empresa, no por la cirugía concreta que cruzó: un
          // mismo representante suele cubrir varias cirugías de su casa en el
          // día, y exigir un ingreso por cirugía marcaría falsas ausencias.
          const cirugiasSinProveedor = cirugiasConEstado.filter(c => c.estado === 'SIN_PROVEEDOR');

          return { visitas: visitasCruzadas, cirugiasConEstado, cirugiasSinProveedor };
        };

        // Estado de cada cirugía frente al registro de proveedores
        const ESTADOS_CIRUGIA = {
          PRESENTE:      { txt: 'Registrado',            clase: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
          CASA_PRESENTE: { txt: 'Casa en sitio',         clase: 'bg-teal-100 text-teal-800 border-teal-300' },
          SIN_PROVEEDOR: { txt: 'Sin registro de ingreso', clase: 'bg-red-100 text-red-800 border-red-300' },
          NO_REQUIERE:   { txt: 'No requiere',           clase: 'bg-gray-100 text-gray-600 border-gray-300' }
        };

        const ETIQUETAS_ALERTA = {
          SIN_PROGRAMACION:  { txt: 'Sin cirugía programada', clase: 'bg-amber-100 text-amber-800 border-amber-300' },
          SALIDA_OTRO_DIA:   { txt: 'Salió otro día',         clase: 'bg-blue-100 text-blue-800 border-blue-300' },
          INGRESO_VISPERA:   { txt: 'Ingresó la víspera',     clase: 'bg-sky-100 text-sky-800 border-sky-300' },
          LLEGADA_TARDE:     { txt: 'Llegada tardía',         clase: 'bg-orange-100 text-orange-800 border-orange-300' },
          SIN_SALIDA:        { txt: 'Sin salida registrada',  clase: 'bg-red-100 text-red-800 border-red-300' },
          PERMANENCIA_LARGA: { txt: 'Permanencia larga',      clase: 'bg-purple-100 text-purple-800 border-purple-300' },
          SIN_INGRESO:       { txt: 'Sin ingreso registrado', clase: 'bg-red-100 text-red-800 border-red-300' }
        };

        // --------------------------------------------------------------------
        // Lectura del Excel de programación quirúrgica
        // --------------------------------------------------------------------

        /** Sinónimos aceptados para cada columna del Excel. */
        const MAPA_COLUMNAS_QX = {
          num:          ['NUM','NO','N','NUMERO','CONSECUTIVO'],
          hora:         ['HORA','HORAINICIO','HORADEINICIO','INICIO','HORAPROGRAMADA'],
          duracion:     ['TIEMPOCX','TIEMPOQX','TIEMPO','DURACION','TIEMPOQUIRURGICO'],
          procedimiento:['PROCEDIMIENTO','CIRUGIA','INTERVENCION','TIPODECIRUGIA','DESCRIPCION'],
          cirujano:     ['CIRUJANO','MEDICO','MEDICOTRATANTE','DOCTOR','RESPONSABLE'],
          convenio:     ['CONVENIO','ASEGURADORA','TIPODEPACIENTE'],
          proveedor:    ['PROVEEDOR','CASACOMERCIAL','EMPRESA','DISTRIBUIDOR','MARCA'],
          material:     ['MATERIALAREQUERIR','MATERIAL','REQUERIMIENTOS','EQUIPO','INSTRUMENTAL','INSUMOS'],
          servicio:     ['SERVICIO','SALA','QUIROFANO','AREA']
        };

        /** Columnas que NUNCA se importan (datos personales del paciente). */
        const COLUMNAS_PROHIBIDAS = [
          'PACIENTE','NOMBREDELPACIENTE','NOMBREPACIENTE','EXPEDIENTE','NOEXPEDIENTE',
          'NSS','CURP','RFC','EDAD','SEXO','GENERO','FECHADENACIMIENTO',
          'DIAGNOSTICO','TELEFONO','DOMICILIO','POLIZA','CAMA','CUARTO','HABITACION'
        ];

        const normCol = (h) => String(h || '')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^A-Za-z0-9]/g, '').toUpperCase();

        const MESES_ES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO',
                          'AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

        /**
         * Extrae la fecha del encabezado del archivo. En la programación real
         * la fecha NO está en ninguna columna: vive en el título, escrita en
         * español ("PROGRAMACION DIARIA / SABADO 04 DE JULIO DEL 2026").
         */
        const fechaDesdeTitulo = (texto) => {
          const t = String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
          let m = t.match(/(\d{1,2})\s+DE\s+([A-Z]+)\s+(?:DE[L]?\s+)?(\d{4})/);
          if (m) {
            const mes = MESES_ES.indexOf(m[2]);
            if (mes > -1) return `${m[3]}-${String(mes+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
          }
          m = t.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);      // dd/mm/aaaa
          if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
          m = t.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);      // aaaa-mm-dd
          if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
          return '';
        };

        /** Serial de Excel, Date o texto -> 'HH:mm'. Vacío para "A/S", "S/H". */
        const excelAHora = (v) => {
          if (v === null || v === undefined || v === '') return '';
          if (typeof v === 'number') {
            const total = Math.round((v - Math.floor(v)) * 1440);
            return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
          }
          if (v instanceof Date) {
            return `${String(v.getHours()).padStart(2,'0')}:${String(v.getMinutes()).padStart(2,'0')}`;
          }
          const s = String(v).trim().toUpperCase();
          const m = s.match(/(\d{1,2})\s*:\s*(\d{2})/);
          if (!m) return '';                       // "A/S" = a solicitud, sin hora fija
          let h = parseInt(m[1], 10);
          if (s.includes('PM') && h < 12) h += 12;
          if (s.includes('AM') && h === 12) h = 0;
          return `${String(h).padStart(2,'0')}:${m[2]}`;
        };

        /** Marcadores de servicio que aparecen como fila suelta en la columna 1. */
        const SERVICIOS_CONOCIDOS = ['ENDOSCOPIA','HEMODINAMIA','QUIROFANO','TOCOCIRUGIA',
                                     'IMAGENOLOGIA','CIRUGIA AMBULATORIA','UCI'];

        const esMarcadorServicio = (celda, resto) => {
          const t = normCol(celda);
          if (!t) return false;
          if (resto.some(c => c !== '' && c !== null)) return false;   // debe ir sola en su fila
          return SERVICIOS_CONOCIDOS.some(sv => normCol(sv) === t);
        };

        /**
         * Convierte la programación quirúrgica en filas listas para importar.
         *
         * Estructura real del archivo:
         *   fila 1-2  membrete y título con la FECHA
         *   fila 3    encabezados (NUM, HORA, PACIENTE, EDAD, PROCEDIMIENTO...)
         *   filas 4+  procedimientos, con marcadores de servicio intercalados
         *             ("ENDOSCOPIA", "HEMODINAMIA") que dividen la lista
         *
         * Solo se lee la hoja PROGRAMACIÓN: las hojas por servicio repiten
         * los mismos procedimientos y los duplicarían.
         */
        const procesarExcelQuirurgico = (arrayBuffer) => {
          const libro = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });

          const preferida = libro.SheetNames.find(n => normCol(n).startsWith('PROGRAMACION'))
                          || libro.SheetNames[0];
          const hoja = libro.Sheets[preferida];
          const matriz = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: '', raw: true });
          if (!matriz.length) return { error: 'El archivo no tiene datos.' };

          // --- Localizar la fila de encabezados
          const conocidas = new Set(Object.values(MAPA_COLUMNAS_QX).flat());
          let filaEnc = -1, mejor = 0;
          for (let i = 0; i < Math.min(matriz.length, 25); i++) {
            const aciertos = matriz[i].filter(c => conocidas.has(normCol(c))).length;
            if (aciertos > mejor) { mejor = aciertos; filaEnc = i; }
          }
          if (mejor < 3) {
            return { error: 'No se reconocieron los encabezados. Se esperan columnas como HORA, PROCEDIMIENTO, CIRUJANO y PROVEEDOR.' };
          }

          // --- Fecha: se busca en todo lo que está por encima de los encabezados
          let fechaArchivo = '';
          for (let i = 0; i < filaEnc && !fechaArchivo; i++) {
            for (const celda of matriz[i]) {
              const f = fechaDesdeTitulo(celda);
              if (f) { fechaArchivo = f; break; }
            }
          }
          if (!fechaArchivo) {
            return { error: 'No se encontró la fecha en el encabezado del archivo. Se espera algo como "PROGRAMACION DIARIA SABADO 04 DE JULIO DEL 2026".' };
          }

          const encabezados = matriz[filaEnc].map(normCol);
          const indice = {};
          Object.keys(MAPA_COLUMNAS_QX).forEach(campo => {
            indice[campo] = encabezados.findIndex(h => MAPA_COLUMNAS_QX[campo].includes(h));
          });

          const descartadas = [];
          encabezados.forEach((h, i) => {
            if (!h || Object.values(indice).includes(i)) return;
            descartadas.push({
              nombre: String(matriz[filaEnc][i]).replace(/\s+/g, ' ').trim(),
              sensible: COLUMNAS_PROHIBIDAS.includes(h)
            });
          });
          // La edad y el paciente vienen en columnas reconocibles: se marcan aunque
          // no estuvieran en la lista, para que quede explícito que no se importan.
          ['PACIENTE','EDAD'].forEach(c => {
            const i = encabezados.indexOf(c);
            if (i > -1 && !descartadas.some(d => normCol(d.nombre) === c)) {
              descartadas.push({ nombre: String(matriz[filaEnc][i]), sensible: true });
            }
          });

          const filas = [];
          const problemas = [];
          const proveedoresDetectados = {};
          let servicio = 'QUIROFANO';    // lo que va antes del primer marcador

          for (let i = filaEnc + 1; i < matriz.length; i++) {
            const r = matriz[i] || [];
            if (r.every(c => c === '' || c === null)) continue;

            // ¿Es una fila que solo anuncia el servicio?
            if (esMarcadorServicio(r[0], r.slice(1))) {
              servicio = String(r[0]).replace(/\s+/g, ' ').trim().toUpperCase();
              continue;
            }

            const procedimiento = indice.procedimiento > -1
              ? String(r[indice.procedimiento] || '').replace(/\s+/g, ' ').trim() : '';
            if (!procedimiento) continue;          // filas de relleno o totales

            const crudo = indice.proveedor > -1 ? String(r[indice.proveedor] || '') : '';
            const casa = extraerCasaComercial(crudo);
            if (casa) proveedoresDetectados[casa] = (proveedoresDetectados[casa] || 0) + 1;

            const hora = excelAHora(indice.hora > -1 ? r[indice.hora] : '');
            if (!hora && indice.hora > -1 && String(r[indice.hora] || '').trim()) {
              problemas.push(`Fila ${i + 1}: hora "${String(r[indice.hora]).trim()}" sin formato reconocible (se importa sin hora).`);
            }

            filas.push([
              fechaArchivo,
              indice.servicio > -1 && r[indice.servicio] ? String(r[indice.servicio]).trim() : servicio,
              hora,
              excelAHora(indice.duracion > -1 ? r[indice.duracion] : ''),
              procedimiento,
              indice.cirujano > -1 ? String(r[indice.cirujano] || '').replace(/\s+/g, ' ').trim() : '',
              casa,
              crudo.replace(/\s+/g, ' ').trim().substring(0, 150),
              indice.material > -1 ? String(r[indice.material] || '').replace(/\s+/g, ' ').trim().substring(0, 200) : '',
              indice.convenio > -1 ? String(r[indice.convenio] || '').trim() : ''
            ]);
          }

          if (!filas.length) return { error: 'No se encontró ningún procedimiento en la hoja "' + preferida + '".' };

          return {
            filas,
            fechas: [fechaArchivo],
            hoja: preferida,
            descartadas,
            problemas,
            columnasDetectadas: Object.keys(indice).filter(k => indice[k] > -1),
            proveedores: Object.entries(proveedoresDetectados).sort((a, b) => b[1] - a[1]),
            sinCasaComercial: filas.filter(f => !f[6]).length,
            servicios: [...new Set(filas.map(f => f[1]))]
          };
        };


        /** Días del mes (yyyy-MM) que tocan según la frecuencia elegida. */
        const diasProgramados = (mesStr, frecuencia) => {
            const [anio, mes] = String(mesStr || '').split('-').map(n => parseInt(n, 10));
            if (!anio || !mes) return [];
            const total = new Date(anio, mes, 0).getDate();
            const dias = [];
            for (let d = 1; d <= total; d++) {
                if (frecuencia === 'D' || new Date(anio, mes - 1, d).getDay() === frecuencia) dias.push(d);
            }
            return dias;
        };

        // ============================================================================
        // [SEC] PANTALLA DE ACCESO
        // ----------------------------------------------------------------------------
        // El PIN NO se valida aquí (el HTML es público en GitHub Pages y cualquiera
        // puede leerlo): se envía al backend, que lo compara contra CLAVES_ACCESO,
        // resuelve el nombre del usuario y registra el intento —válido o fallido—
        // en la hoja "Accesos" del libro de Google Sheets.
        // ============================================================================
        const PantallaAcceso = ({ onAcceso }) => {
            const [pin, setPin] = useState('');
            const [verificando, setVerificando] = useState(false);
            const [errorAcceso, setErrorAcceso] = useState(null);

            const entrar = async (e) => {
                e.preventDefault();
                const limpio = pin.trim();
                if (!limpio) { setErrorAcceso('Escribe tu PIN de acceso.'); return; }
                setVerificando(true);
                setErrorAcceso(null);
                try {
                    const resp = await jsonpRequest({ action: 'login', pin: limpio });
                    if (resp && resp.ok && resp.usuario) {
                        onAcceso(limpio, resp.usuario);
                    } else {
                        setErrorAcceso('Respuesta inesperada del servidor.');
                    }
                } catch (err) {
                    const msg = String(err.message || '');
                    setErrorAcceso(msg.indexOf('ACCESO_DENEGADO') > -1
                        ? 'PIN incorrecto. El intento quedó registrado en la bitácora de accesos.'
                        : 'No se pudo verificar el acceso: ' + msg);
                } finally {
                    setVerificando(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 font-sans">
                    <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 animate-in fade-in zoom-in-95 duration-300">
                        <div className="flex flex-col items-center mb-6">
                            <img src={LOGO_ESTHER_URL} alt="CMMS E.S.T.H.E.R"
                                 className="w-20 h-20 rounded-2xl mb-4 shadow-lg shadow-blue-500/20" />
                            <h1 className="text-2xl font-bold text-white tracking-tight">CMMS E.S.T.H.E.R</h1>
                            <p className="text-xs text-slate-400 mt-1">Ingeniería Biomédica y Tecnovigilancia · HSAIP</p>
                        </div>

                        <form onSubmit={entrar} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                                    <i className="fas fa-key mr-2 text-blue-400"></i>PIN de acceso
                                </label>
                                <input
                                    type="password"
                                    value={pin}
                                    onChange={(e) => setPin(e.target.value)}
                                    autoFocus
                                    autoComplete="current-password"
                                    placeholder="••••••••"
                                    className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg text-white text-center text-lg tracking-widest outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition"
                                />
                            </div>

                            {errorAcceso && (
                                <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300 flex items-start gap-2">
                                    <i className="fas fa-triangle-exclamation mt-0.5"></i>
                                    <span>{errorAcceso}</span>
                                </div>
                            )}

                            <button type="submit" disabled={verificando}
                                className="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-blue-600/20 disabled:opacity-50 disabled:cursor-not-allowed">
                                {verificando
                                    ? (<><i className="fas fa-circle-notch fa-spin"></i> Verificando...</>)
                                    : (<><i className="fas fa-right-to-bracket"></i> Entrar</>)}
                            </button>
                        </form>

                        <p className="text-[11px] text-slate-500 mt-6 text-center leading-relaxed">
                            <i className="fas fa-shield-halved mr-1"></i>
                            Cada intento de acceso queda registrado con fecha, hora y resultado.
                        </p>
                    </div>
                </div>
            );
        };

        // ============================================================================
        // [NEW-14] EXPEDIENTE DIGITAL DEL EQUIPO (Google Drive)
        // ----------------------------------------------------------------------------
        // Cada equipo tiene una carpeta en Drive ("Nombre del equipo + No. de
        // inventario") con su manual y sus órdenes de servicio nombradas con
        // prefijo + fecha (OSMP 2026-05-12, OSMC_20260311, ...). El backend la
        // localiza, clasifica y devuelve el historial; el visor integrado trae
        // el documento en base64, así el personal lo consulta sin necesitar
        // permisos de Drive. Toda consulta queda registrada en "Accesos".
        // ============================================================================
        const TIPOS_ORDEN = {
            OSMP: { label: 'Preventivo',  icono: 'fa-calendar-check', clase: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
            OSMC: { label: 'Correctivo',  icono: 'fa-screwdriver-wrench', clase: 'bg-red-100 text-red-800 border-red-300' },
            OSI:  { label: 'Instalación', icono: 'fa-plug', clase: 'bg-blue-100 text-blue-800 border-blue-300' },
            OSB:  { label: 'Baja',        icono: 'fa-box-archive', clase: 'bg-gray-200 text-gray-700 border-gray-300' },
            OSA:  { label: 'Asistencia',  icono: 'fa-headset', clase: 'bg-amber-100 text-amber-800 border-amber-300' }
        };

        // ============================================================================
        // [REV-15] SUBIDA DE LA ORDEN DE SERVICIO AL EXPEDIENTE
        // ----------------------------------------------------------------------------
        // El expediente era de solo lectura: el PDF firmado se subía a mano a
        // Drive y bastaba equivocarse en el nombre para que dejara de aparecer
        // clasificado en la ficha del equipo. Ahora se sube desde el CMMS y el
        // NOMBRE LO ESCRIBE EL SERVIDOR con la convención oficial
        // (OS-Preventivo-04-05-2026-15-15.pdf).
        //
        // TRANSPORTE: un PDF no cabe en una URL, así que esta es la única
        // operación de la aplicación que viaja por POST. Como la respuesta de
        // un POST a Apps Script puede quedar bloqueada por CORS —el mismo
        // motivo por el que todo lo demás usa JSONP—, no se depende de poder
        // leerla: el backend guarda el resultado bajo la referencia del intento
        // y aquí se consulta por JSONP si el POST no devolvió nada legible. La
        // referencia también da idempotencia: si se reenvía, el servidor
        // devuelve el archivo ya creado en vez de subir un duplicado.
        // ============================================================================

        /** Límite de subida; debe coincidir con MAX_SUBIDA_MB de Codigo.gs. */
        const MAX_SUBIDA_MB = 12;

        /** Espejo de codigoTipoOrden() del backend, para la vista previa. */
        const codigoTipoOrdenCliente = (texto) => {
            const s = String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
            if (!s) return '';
            if (TIPOS_ORDEN[s]) return s;
            if (s.indexOf('PREVENT') > -1) return 'OSMP';
            if (s.indexOf('CORRECT') > -1) return 'OSMC';
            if (s.indexOf('INSTALA') > -1) return 'OSI';
            if (s.indexOf('BAJA') > -1 || s.indexOf('DESINCORPOR') > -1) return 'OSB';
            if (s.indexOf('ASISTEN') > -1 || s.indexOf('APOYO') > -1 || s.indexOf('CAPACITA') > -1) return 'OSA';
            return '';
        };

        /** Espejo de NOMBRE_TIPO_ORDEN: sin acentos, igual que en Drive. */
        const NOMBRE_TIPO_ORDEN = {
            OSMP: 'Preventivo', OSMC: 'Correctivo', OSI: 'Instalacion',
            OSB: 'Baja', OSA: 'Asistencia'
        };

        /** Vista previa del nombre definitivo: OS-Preventivo-04-05-2026-15-15.pdf */
        const nombreArchivoOrdenCliente = (codigo, fechaISO, horaHM, extension) => {
            const p = String(fechaISO || '').split('-');
            if (p.length !== 3) return '';
            let base = `OS-${NOMBRE_TIPO_ORDEN[codigo] || 'Servicio'}-${p[2]}-${p[1]}-${p[0]}`;
            if (horaHM) base += '-' + String(horaHM).replace(':', '-');
            return base + (extension ? '.' + extension : '');
        };

        const extensionDeArchivo = (nombre) => {
            const m = String(nombre || '').match(/\.([A-Za-z0-9]{1,5})$/);
            return m ? m[1].toLowerCase() : '';
        };

        const fechaISOHoy = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const horaHMAhora = () => {
            const d = new Date();
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        };

        /**
         * [REV-15] Fecha que se propone para la orden de un mantenimiento del
         * calendario. El calendario razona en periodos 'yyyy-MM', no en días:
         * si el periodo marcado es el mes en curso lo natural es hoy; si es un
         * mes anterior (captura retrasada) se propone su último día, que es lo
         * más tarde que ese mantenimiento pudo ejecutarse dentro del periodo.
         * Siempre queda editable antes de subir.
         */
        const fechaSugeridaPeriodo = (periodo) => {
            const hoy = fechaISOHoy();
            const p = String(periodo || '');
            if (!/^\d{4}-\d{2}$/.test(p)) return hoy;
            if (p === hoy.slice(0, 7)) return hoy;
            const [a, m] = p.split('-').map(Number);
            const ultimo = new Date(a, m, 0).getDate();   // día 0 del mes siguiente
            return `${p}-${String(ultimo).padStart(2, '0')}`;
        };

        /** Archivo -> base64 sin el prefijo "data:...;base64," */
        const archivoABase64 = (file) => new Promise((resolve, reject) => {
            const lector = new FileReader();
            lector.onload = () => {
                const r = String(lector.result || '');
                const coma = r.indexOf(',');
                resolve(coma > -1 ? r.slice(coma + 1) : r);
            };
            lector.onerror = () => reject(new Error('No se pudo leer el archivo seleccionado.'));
            lector.readAsDataURL(file);
        });

        const espera = (ms) => new Promise(r => setTimeout(r, ms));

        /**
         * Sube la orden y devuelve el resultado del backend.
         * Nunca lanza por un fallo de CORS: si la respuesta del POST no se
         * puede leer, el resultado se recupera por JSONP.
         */
        const subirOrdenADrive = async (datos, alAvanzar) => {
            const ref = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            const cuerpo = JSON.stringify({
                ...datos,
                action: 'subirOrden',
                ref,
                pin: SESION.pin,
                ua: (navigator.userAgent || '').slice(0, 150)
            });

            if (alAvanzar) alAvanzar('Enviando el archivo a Drive...');

            let resultado = null;
            try {
                // Sin encabezados propios: el cuerpo viaja como text/plain, que
                // es una "petición simple" y no dispara el preflight de CORS.
                const resp = await fetch(GOOGLE_SHEETS_WEBAPP_URL, { method: 'POST', body: cuerpo });
                resultado = JSON.parse(await resp.text());
            } catch (err) {
                resultado = null;   // el archivo sí viajó; solo no se pudo LEER la respuesta
            }
            if (resultado) return resultado;

            if (alAvanzar) alAvanzar('Archivo enviado. Confirmando con el servidor...');
            for (let i = 0; i < 14; i++) {
                await espera(1600);
                const r = await jsonpRequest({ action: 'estadoSubida', ref }, 20000).catch(() => null);
                if (r && r.estado === 'listo') return r.resultado;
            }
            throw new Error('El archivo se envió pero el servidor no confirmó el resultado. ' +
                            'Revisa la carpeta del equipo en Drive antes de volver a subirlo.');
        };

        /**
         * Panel de subida reutilizable: se usa desde el detalle de una orden
         * de servicio y desde el mantenimiento preventivo recién marcado.
         * Consulta primero la carpeta destino, para que quien sube sepa
         * ADÓNDE va el archivo antes de mandarlo, y avisa si ya existe una
         * orden del mismo tipo y fecha en el expediente.
         */
        const SubirOrdenDrive = ({ inventario, nombreEquipo, tipoSugerido, fechaSugerida, horaSugerida, onSubida }) => {
            const [archivo, setArchivo]   = useState(null);
            const [tipo, setTipo]         = useState(() => codigoTipoOrdenCliente(tipoSugerido) || 'OSMP');
            const [fecha, setFecha]       = useState(fechaSugerida || fechaISOHoy());
            const [hora, setHora]         = useState(horaSugerida || horaHMAhora());
            const [destino, setDestino]   = useState(null);      // resultado de getDocumentosEquipo
            const [buscando, setBuscando] = useState(true);
            const [subiendo, setSubiendo] = useState(false);
            const [paso, setPaso]         = useState('');
            const [error, setError]       = useState(null);
            const [logro, setLogro]       = useState(null);      // resultado exitoso
            const inputRef = useRef(null);

            const localizarCarpeta = async (forzar) => {
                if (!inventario) { setBuscando(false); return; }
                if (!forzar && CACHE_EXPEDIENTES.has(inventario)) {
                    setDestino(CACHE_EXPEDIENTES.get(inventario));
                    setBuscando(false);
                    return;
                }
                setBuscando(true);
                try {
                    const r = await jsonpConReintentos({
                        action: 'getDocumentosEquipo',
                        inventario,
                        refrescar: forzar ? '1' : '0'
                    });
                    setDestino(r);
                    if (r && r.encontrada) CACHE_EXPEDIENTES.set(inventario, r);
                } catch (err) {
                    setDestino(null);
                } finally {
                    setBuscando(false);
                }
            };

            useEffect(() => { localizarCarpeta(false); }, [inventario]);

            const extension = extensionDeArchivo(archivo && archivo.name) || 'pdf';
            const nombreFinal = nombreArchivoOrdenCliente(tipo, fecha, hora, extension);
            const pesoMB = archivo ? archivo.size / 1048576 : 0;
            const excedeTamano = pesoMB > MAX_SUBIDA_MB;

            // ¿Ya hay una orden de este tipo con esta fecha en el expediente?
            const duplicadoProbable = useMemo(() => {
                const lista = (destino && destino.ordenes) || [];
                return lista.find(o => o.tipo === tipo && o.fecha === fecha) || null;
            }, [destino, tipo, fecha]);

            const enviar = async (crearCarpeta) => {
                if (!archivo || subiendo) return;
                setSubiendo(true); setError(null); setPaso('Preparando el archivo...');
                try {
                    const base64 = await archivoABase64(archivo);
                    const r = await subirOrdenADrive({
                        inventario,
                        nombreEquipo: nombreEquipo || '',
                        tipo,
                        fecha,
                        hora,
                        mime: archivo.type || '',
                        nombreArchivo: archivo.name || '',
                        base64,
                        crearCarpeta: crearCarpeta ? '1' : '0'
                    }, setPaso);

                    if (r && r.ok) {
                        setLogro(r);
                        setArchivo(null);
                        if (inputRef.current) inputRef.current.value = '';
                        // El expediente cacheado quedó obsoleto: se relee para
                        // que la ficha del equipo ya muestre la orden nueva.
                        CACHE_EXPEDIENTES.delete(inventario);
                        localizarCarpeta(true);
                        if (onSubida) onSubida(r);
                    } else {
                        setError(r || { error: 'Respuesta vacía del servidor.' });
                    }
                } catch (err) {
                    setError({ error: err.message || String(err) });
                } finally {
                    setSubiendo(false); setPaso('');
                }
            };

            if (!inventario) {
                return (
                    <div className="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-lg text-xs text-amber-800">
                        <p className="font-bold">No se puede subir la orden</p>
                        <p className="mt-1">
                            El registro no tiene número de inventario, y la carpeta del expediente se
                            localiza en Drive por ese número. Captúralo en el formulario para poder
                            archivar la orden.
                        </p>
                    </div>
                );
            }

            return (
                <div className="border border-gray-200 rounded-xl overflow-hidden">
                    <div className="px-4 py-2.5 bg-slate-50 border-b border-gray-200 flex flex-wrap items-center justify-between gap-2">
                        <p className="text-[11px] font-bold uppercase tracking-wider text-gray-500">
                            <i className="fas fa-cloud-arrow-up mr-2 text-blue-600"></i>
                            Archivar la orden en el expediente
                        </p>
                        {buscando ? (
                            <span className="text-[11px] text-gray-400">
                                <i className="fas fa-circle-notch fa-spin mr-1"></i> Localizando la carpeta...
                            </span>
                        ) : destino && destino.encontrada ? (
                            <a href={destino.carpetaUrl} target="_blank" rel="noopener noreferrer"
                               className="text-[11px] text-blue-600 hover:text-blue-800 font-medium truncate max-w-[260px]"
                               title={destino.carpeta}>
                                <i className="fab fa-google-drive mr-1"></i>{destino.carpeta}
                            </a>
                        ) : (
                            <span className="text-[11px] text-amber-700 font-medium">
                                <i className="fas fa-folder-minus mr-1"></i> Sin carpeta en Drive
                            </span>
                        )}
                    </div>

                    <div className="p-4 space-y-3">
                        {logro && (
                            <div className="bg-emerald-50 border-l-4 border-emerald-500 p-3 rounded-lg text-xs">
                                <p className="font-bold text-emerald-800">
                                    <i className="fas fa-circle-check mr-1"></i> Orden archivada
                                </p>
                                <p className="text-emerald-700 mt-1 break-all">
                                    {logro.nombre} · carpeta {logro.carpeta}
                                    {logro.carpetaCreada && ' (creada ahora)'}
                                </p>
                                <a href={logro.url} target="_blank" rel="noopener noreferrer"
                                   className="inline-block mt-1 text-emerald-800 font-bold hover:underline">
                                    Ver en Drive <i className="fas fa-arrow-up-right-from-square ml-1"></i>
                                </a>
                            </div>
                        )}

                        {error && (
                            <div className="bg-red-50 border-l-4 border-red-500 p-3 rounded-lg text-xs">
                                <p className="font-bold text-red-800">No se pudo archivar la orden</p>
                                <p className="text-red-700 mt-1 break-words">{error.error}</p>
                                {error.carpetaFaltante && (
                                    <div className="mt-2">
                                        <p className="text-red-700">
                                            Puedo crearla ahora con el nombre <strong>{error.nombreSugerido}</strong>,
                                            o créala tú en Drive y vuelve a intentar.
                                        </p>
                                        <button onClick={() => enviar(true)} disabled={subiendo}
                                            className="mt-2 px-3 py-1.5 rounded-lg bg-amber-600 text-white font-bold text-xs hover:bg-amber-700 disabled:opacity-40">
                                            <i className="fas fa-folder-plus mr-1"></i> Crear carpeta y subir
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div className="col-span-2">
                                <label className="block text-[11px] font-bold text-gray-600 mb-1">Tipo de orden</label>
                                <select value={tipo} onChange={(e) => setTipo(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                                    {Object.keys(TIPOS_ORDEN).map(c => (
                                        <option key={c} value={c}>{TIPOS_ORDEN[c].label}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-[11px] font-bold text-gray-600 mb-1">Fecha del servicio</label>
                                <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
                            </div>
                            <div>
                                <label className="block text-[11px] font-bold text-gray-600 mb-1">Hora (opcional)</label>
                                <input type="time" value={hora} onChange={(e) => setHora(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
                            </div>
                        </div>

                        <div>
                            <label className="block text-[11px] font-bold text-gray-600 mb-1">
                                Archivo de la orden firmada
                            </label>
                            <input ref={inputRef} type="file"
                                accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.tif,.tiff,.doc,.docx,.xls,.xlsx"
                                onChange={(e) => { setArchivo(e.target.files[0] || null); setError(null); setLogro(null); }}
                                className="w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                            <p className="text-[11px] text-gray-400 mt-1">
                                PDF escaneado, foto o documento de Office. Máximo {MAX_SUBIDA_MB} MB.
                            </p>
                        </div>

                        {archivo && (
                            <div className="bg-blue-50/60 border border-blue-100 rounded-lg p-3 text-xs space-y-1">
                                <p className="text-gray-600">
                                    Se guardará como{' '}
                                    <strong className="font-mono text-blue-800 break-all">{nombreFinal}</strong>
                                </p>
                                <p className="text-gray-500">
                                    {archivo.name} · {pesoMB.toFixed(2)} MB
                                    {excedeTamano && (
                                        <span className="text-red-600 font-bold ml-1">
                                            — excede el límite de {MAX_SUBIDA_MB} MB
                                        </span>
                                    )}
                                </p>
                                {duplicadoProbable && (
                                    <p className="text-amber-700 font-medium">
                                        <i className="fas fa-triangle-exclamation mr-1"></i>
                                        Ya hay una orden {TIPOS_ORDEN[tipo].label.toLowerCase()} con esta fecha
                                        en el expediente ({duplicadoProbable.nombre}). Si subes otra, se guardará
                                        con un consecutivo al final.
                                    </p>
                                )}
                            </div>
                        )}

                        <div className="flex flex-wrap items-center justify-end gap-3">
                            {subiendo && paso && (
                                <span className="text-xs text-gray-500 mr-auto">
                                    <i className="fas fa-circle-notch fa-spin mr-1"></i> {paso}
                                </span>
                            )}
                            <button onClick={() => enviar(false)}
                                disabled={!archivo || subiendo || excedeTamano}
                                className="flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600 text-white font-medium text-sm hover:bg-blue-700 disabled:opacity-40">
                                <i className={`fas ${subiendo ? 'fa-spinner fa-spin' : 'fa-cloud-arrow-up'}`}></i>
                                {subiendo ? 'Subiendo...' : 'Subir al expediente'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ExpedienteEquipo = ({ equipo }) => {
            const [docs, setDocs] = useState(null);
            const [cargandoDocs, setCargandoDocs] = useState(true);
            const [errorDocs, setErrorDocs] = useState(null);
            const [filtroTipo, setFiltroTipo] = useState('TODAS');
            // visor: { nombre, cargando } mientras descarga; luego { nombre, url, mime }
            const [visor, setVisor] = useState(null);

            const cargarExpediente = async (forzar) => {
                if (!equipo.numeroInventario) {
                    setErrorDocs('Este registro no tiene número de inventario; no es posible localizar su carpeta en Drive.');
                    setCargandoDocs(false);
                    return;
                }
                // [PERF] Ficha ya consultada en esta sesión: respuesta inmediata
                // sin volver a preguntar a Drive. "Actualizar" fuerza el refresco.
                if (!forzar && CACHE_EXPEDIENTES.has(equipo.numeroInventario)) {
                    setDocs(CACHE_EXPEDIENTES.get(equipo.numeroInventario));
                    setErrorDocs(null);
                    setCargandoDocs(false);
                    return;
                }
                setCargandoDocs(true);
                setErrorDocs(null);
                try {
                    const r = await jsonpConReintentos({
                        action: 'getDocumentosEquipo',
                        inventario: equipo.numeroInventario,
                        refrescar: forzar ? '1' : '0'   // salta también la caché del servidor
                    });
                    setDocs(r);
                    if (r && r.encontrada) CACHE_EXPEDIENTES.set(equipo.numeroInventario, r);
                } catch (err) {
                    setErrorDocs(err.message || 'No se pudo consultar el expediente en Drive.');
                } finally {
                    setCargandoDocs(false);
                }
            };

            useEffect(() => {
                setDocs(null);
                setFiltroTipo('TODAS');
                cargarExpediente();
                // Al desmontar, libera el blob del visor si quedó abierto
                return () => setVisor(v => { if (v && v.url) URL.revokeObjectURL(v.url); return null; });
            }, [equipo.numeroInventario]);

            const abrirDocumento = async (archivo) => {
                setVisor({ nombre: archivo.nombre, cargando: true });
                try {
                    // 60s de espera: los PDF escaneados pueden pesar varios MB
                    const r = await jsonpRequest({ action: 'getArchivo', id: archivo.id }, 60000);
                    if (r && r.ok && r.base64) {
                        const bin = atob(r.base64);
                        const bytes = new Uint8Array(bin.length);
                        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                        const blob = new Blob([bytes], { type: r.mime || 'application/octet-stream' });
                        setVisor({ nombre: r.nombre, url: URL.createObjectURL(blob), mime: r.mime || '' });
                    } else {
                        // Archivo demasiado grande para el visor: se abre en Drive
                        setVisor(null);
                        if (r && r.motivo) alert(r.motivo);
                        window.open((r && r.url) || archivo.url, '_blank');
                    }
                } catch (err) {
                    // Cualquier falla del visor degrada a abrir el archivo en Drive
                    setVisor(null);
                    window.open(archivo.url, '_blank');
                }
            };

            const cerrarVisor = () => {
                setVisor(v => { if (v && v.url) URL.revokeObjectURL(v.url); return null; });
            };

            const conteosPorTipo = useMemo(() => {
                const c = { TODAS: 0, OSMP: 0, OSMC: 0, OSI: 0, OSB: 0, OSA: 0 };
                ((docs && docs.ordenes) || []).forEach(o => {
                    c.TODAS++;
                    if (c[o.tipo] !== undefined) c[o.tipo]++;
                });
                return c;
            }, [docs]);

            const ordenesVisibles = useMemo(() => {
                const lista = (docs && docs.ordenes) || [];
                return filtroTipo === 'TODAS' ? lista : lista.filter(o => o.tipo === filtroTipo);
            }, [docs, filtroTipo]);

            const FilaDocumento = ({ archivo, mostrarTipo }) => {
                const t = TIPOS_ORDEN[archivo.tipo];
                return (
                    <tr className="border-b border-gray-50 hover:bg-blue-50/40 transition text-sm">
                        {mostrarTipo && (
                            <td className="p-3 whitespace-nowrap">
                                <span className={`px-2.5 py-1 rounded-lg border font-bold text-[11px] uppercase tracking-wider ${t ? t.clase : 'bg-gray-100 text-gray-600 border-gray-200'}`}>
                                    <i className={`fas ${t ? t.icono : 'fa-file'} mr-1.5`}></i>{t ? t.label : archivo.tipo}
                                </span>
                            </td>
                        )}
                        <td className="p-3 whitespace-nowrap font-bold text-gray-700">
                            {archivo.fecha
                                ? (<span>{archivo.fecha}{archivo.hora && <span className="ml-1.5 text-gray-400 font-medium text-xs"><i className="far fa-clock mr-0.5"></i>{archivo.hora}</span>}</span>)
                                : <span className="text-gray-400 font-normal italic">Sin fecha</span>}
                        </td>
                        <td className="p-3 text-gray-600 max-w-[320px] truncate" title={archivo.nombre}>{archivo.nombre}</td>
                        <td className="p-3 whitespace-nowrap text-right">
                            <button onClick={() => abrirDocumento(archivo)}
                                className="inline-flex items-center gap-1.5 bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 transition text-xs font-bold shadow-sm">
                                <i className="fas fa-eye"></i> Ver
                            </button>
                            <a href={archivo.url} target="_blank" rel="noopener noreferrer" title="Abrir en Google Drive"
                                className="inline-flex items-center gap-1.5 ml-2 border border-gray-200 text-gray-500 px-3 py-1.5 rounded-lg hover:bg-gray-50 hover:text-gray-700 transition text-xs font-bold">
                                <i className="fab fa-google-drive"></i>
                            </a>
                        </td>
                    </tr>
                );
            };

            return (
                <div>
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                        <p className="text-xs text-gray-400 font-bold uppercase tracking-wider">
                            <i className="fas fa-folder-open mr-2"></i>Expediente Digital · Historial de Mantenimientos
                            {docs && docs.encontrada && (
                                <span className="ml-2 text-[10px] normal-case font-medium text-gray-400">Carpeta: {docs.carpeta}</span>
                            )}
                        </p>
                        <div className="flex flex-wrap gap-2 print-hidden">
                            {docs && docs.encontrada && docs.carpetaUrl && (
                                <a href={docs.carpetaUrl} target="_blank" rel="noopener noreferrer"
                                    className="flex items-center gap-2 border border-gray-200 text-gray-600 px-4 py-2 rounded-lg hover:bg-gray-50 transition shadow-sm font-medium text-sm">
                                    <i className="fab fa-google-drive"></i> Abrir carpeta
                                </a>
                            )}
                            <button onClick={() => cargarExpediente(true)} disabled={cargandoDocs}
                                className="flex items-center gap-2 bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-800 transition shadow-sm font-medium text-sm disabled:opacity-40">
                                <i className={`fas fa-sync-alt ${cargandoDocs ? 'fa-spin' : ''}`}></i> Actualizar
                            </button>
                        </div>
                    </div>

                    {cargandoDocs && (
                        <div className="bg-gray-50 border border-gray-200 rounded-lg p-8 text-center text-gray-400 text-sm">
                            <i className="fas fa-circle-notch fa-spin mr-2"></i> Consultando la carpeta del equipo en Google Drive...
                        </div>
                    )}

                    {!cargandoDocs && errorDocs && (
                        <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-lg text-sm text-red-700">
                            <p className="font-bold mb-1">No se pudo consultar el expediente</p>
                            <p>{errorDocs}</p>
                        </div>
                    )}

                    {!cargandoDocs && !errorDocs && docs && !docs.encontrada && (
                        <div className="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-lg text-sm text-amber-800">
                            <p className="font-bold mb-1"><i className="fas fa-folder-minus mr-2"></i>Carpeta no localizada en Drive</p>
                            <p>{docs.mensaje}</p>
                        </div>
                    )}

                    {!cargandoDocs && !errorDocs && docs && docs.encontrada && (
                        <div className="space-y-4">
                            {/* Manuales del equipo */}
                            {docs.manuales.length > 0 && (
                                <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-xs font-bold text-gray-500 uppercase tracking-wider mr-1"><i className="fas fa-book mr-1"></i> Manuales:</span>
                                    {docs.manuales.map(m => (
                                        <button key={m.id} onClick={() => abrirDocumento(m)} title={m.nombre}
                                            className="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition text-xs font-bold max-w-[260px]">
                                            <i className="fas fa-book-open"></i><span className="truncate">{m.nombre}</span>
                                        </button>
                                    ))}
                                </div>
                            )}

                            {/* Filtros por tipo de orden */}
                            <div className="flex flex-wrap gap-2 print-hidden">
                                {['TODAS', 'OSMP', 'OSMC', 'OSI', 'OSB', 'OSA'].map(t => {
                                    const activo = filtroTipo === t;
                                    const etiqueta = t === 'TODAS' ? 'Todas' : (TIPOS_ORDEN[t] ? TIPOS_ORDEN[t].label : t);
                                    return (
                                        <button key={t} onClick={() => setFiltroTipo(t)} disabled={t !== 'TODAS' && conteosPorTipo[t] === 0}
                                            className={`px-3 py-1.5 rounded-full text-xs font-bold border transition disabled:opacity-30 disabled:cursor-not-allowed ${activo ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-gray-600 border-gray-200 hover:border-blue-300 hover:text-blue-600'}`}>
                                            {etiqueta} <span className={activo ? 'text-blue-100' : 'text-gray-400'}>({conteosPorTipo[t]})</span>
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Historial de órdenes de servicio */}
                            <div className="border border-gray-200 rounded-lg overflow-hidden">
                                <div className="overflow-x-auto max-h-80 overflow-y-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="sticky top-0">
                                            <tr className="bg-gray-50 text-gray-500 text-[11px] uppercase tracking-wider">
                                                <th className="p-3 font-bold border-b">Tipo</th>
                                                <th className="p-3 font-bold border-b">Fecha</th>
                                                <th className="p-3 font-bold border-b">Orden de Servicio</th>
                                                <th className="p-3 font-bold border-b text-right">Documento</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {ordenesVisibles.length === 0 ? (
                                                <tr><td colSpan="4" className="p-6 text-center text-gray-400 text-sm italic">
                                                    {conteosPorTipo.TODAS === 0
                                                        ? 'La carpeta no contiene órdenes de servicio reconocibles (prefijo OSMP / OSMC / OSI / OSB / OSA, o formato "OS-Preventivo-...", "OS-Correctivo-...", "OS-Instalacion-...", "OS-Baja-...", "OS-Asistencia-...").'
                                                        : 'No hay órdenes de este tipo.'}
                                                </td></tr>
                                            ) : (
                                                ordenesVisibles.map(o => <FilaDocumento key={o.id} archivo={o} mostrarTipo={true} />)
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Otros documentos de la carpeta */}
                            {docs.otros.length > 0 && (
                                <details className="text-sm">
                                    <summary className="cursor-pointer text-gray-500 font-medium hover:text-gray-700 select-none">
                                        <i className="fas fa-paperclip mr-1"></i> Otros documentos de la carpeta ({docs.otros.length})
                                    </summary>
                                    <div className="mt-2 flex flex-wrap gap-2">
                                        {docs.otros.map(a => (
                                            <button key={a.id} onClick={() => abrirDocumento(a)} title={a.nombre}
                                                className="inline-flex items-center gap-2 bg-gray-50 text-gray-600 border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition text-xs font-medium max-w-[260px]">
                                                <i className="fas fa-file"></i><span className="truncate">{a.nombre}</span>
                                            </button>
                                        ))}
                                    </div>
                                </details>
                            )}
                        </div>
                    )}

                    {/* Visor de documentos integrado */}
                    {visor && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 print-hidden" onClick={cerrarVisor}>
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-5xl h-[88vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-200"
                                onClick={(e) => e.stopPropagation()}>
                                <div className="px-5 py-3 border-b border-gray-100 flex justify-between items-center gap-3 bg-gray-50">
                                    <p className="font-bold text-gray-800 text-sm truncate" title={visor.nombre}>
                                        <i className="fas fa-file-lines mr-2 text-blue-500"></i>{visor.nombre}
                                    </p>
                                    <div className="flex items-center gap-2">
                                        {visor.url && (
                                            <a href={visor.url} download={visor.nombre}
                                                className="text-xs font-bold text-blue-600 border border-blue-200 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition">
                                                <i className="fas fa-download mr-1"></i> Descargar
                                            </a>
                                        )}
                                        <button onClick={cerrarVisor} className="text-gray-400 hover:text-gray-700 text-xl font-bold px-2">✕</button>
                                    </div>
                                </div>
                                <div className="flex-1 bg-gray-100 flex items-center justify-center overflow-hidden">
                                    {visor.cargando ? (
                                        <div className="text-gray-500 text-sm flex flex-col items-center gap-3">
                                            <i className="fas fa-circle-notch fa-spin text-3xl text-blue-500"></i>
                                            Descargando documento del expediente...
                                        </div>
                                    ) : String(visor.mime).indexOf('image/') === 0 ? (
                                        <img src={visor.url} alt={visor.nombre} className="max-w-full max-h-full object-contain" />
                                    ) : String(visor.mime).indexOf('pdf') > -1 ? (
                                        <iframe src={visor.url} title={visor.nombre} className="w-full h-full border-0"></iframe>
                                    ) : (
                                        <div className="text-center text-gray-500 text-sm p-8">
                                            <i className="fas fa-file-circle-question text-4xl text-gray-300 mb-3"></i>
                                            <p>Este formato no tiene vista previa integrada.</p>
                                            <a href={visor.url} download={visor.nombre} className="text-blue-600 font-bold hover:underline mt-2 inline-block">
                                                Descargar {visor.nombre}
                                            </a>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================================
        // LÓGICA PRINCIPAL CMMS (INVENTARIO Y CALENDARIOS)
        // ============================================================================
        const CMMSHospitalario = () => {
          const [activeTab, setActiveTab] = useState('dashboard');
          const [inventarioTab, setInventarioTab] = usePreferencia('inventarioTab', 'Propio');
          const [equipos, setEquipos] = useState([]);
          const [isSyncing, setIsSyncing] = useState(false);
          const [syncError, setSyncError] = useState(null);
          const [ultimaSync, setUltimaSync] = useState(null);
          const [bitacora, setBitacora] = useState([]);
          // [REV-05] Filas de la hoja "Indicadores" (mismo libro del inventario)
          const [indicadores, setIndicadores] = useState([]);
          // [SEC] Usuario de la sesión activa; el nombre lo resuelve el backend
          // a partir del PIN, nunca lo declara el cliente.
          const [usuarioActivo, setUsuarioActivo] = useState(SESION.usuario);
          // [REV-09] Módulo de Mantenimientos Predictivos (revisión rutinaria)
          const [predMes, setPredMes] = useState(() => {
            const h = new Date();
            return h.getFullYear() + '-' + String(h.getMonth() + 1).padStart(2, '0');
          });
          const [predArea, setPredArea] = usePreferencia('predArea', '');
          const [predOrigen, setPredOrigen] = usePreferencia('predOrigen', 'Todos');
          const [predFrecuencia, setPredFrecuencia] = useState('D');
          const [predDatos, setPredDatos] = useState({});   // inventario -> { dias:{1:'OK'}, obs }
          const [predCargando, setPredCargando] = useState(false);

          // ================================================================
          // [NEW-31] MÓDULO DE PROVEEDORES — estado
          // ================================================================
          const hoyISO = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          };
          const [provVista, setProvVista]       = usePreferencia('provVista', 'bitacora');  // bitacora | cruce | indicadores
          const [provDesde, setProvDesde]       = useState(hoyISO);
          const [provHasta, setProvHasta]       = useState(hoyISO);
          const [provMovs, setProvMovs]         = useState([]);
          const [provCirugias, setProvCirugias] = useState([]);
          const [provCargando, setProvCargando] = useState(false);
          const [provHojas, setProvHojas]       = useState({ proveedores: true, quirurgica: true });
          const [provBusqueda, setProvBusqueda] = useState('');
          const [provFiltroAlerta, setProvFiltroAlerta] = useState('Todas');
          // Importación del Excel
          const [impPrevia, setImpPrevia]   = useState(null);   // resultado de procesarExcelQuirurgico
          const [impArchivo, setImpArchivo] = useState('');
          const [impEstado, setImpEstado]   = useState(null);   // {texto, progreso}
          const [impError, setImpError]     = useState(null);
          const [impAbierto, setImpAbierto] = useState(false);   // selector de archivo colapsado
          const archivoRef = useRef(null);
          // Técnico responsable: se adjunta a cada folio de bitácora (trazabilidad)
          const [tecnicoActivo, setTecnicoActivo] = useState(() => {
            try { return window.localStorage.getItem('cmms_tecnico') || ''; } catch (e) { return ''; }
          });
          useEffect(() => {
            try { window.localStorage.setItem('cmms_tecnico', tecnicoActivo); } catch (e) {}
          }, [tecnicoActivo]);
          const [showAddEquipo, setShowAddEquipo] = useState(false);
          // [FIX-23] Error del alta: se pinta DENTRO del modal. Antes se mandaba
          // a syncError, que se dibuja en el cuerpo de la página y quedaba tapado
          // por el propio modal (fixed inset-0 z-50): el usuario no veía nada.
          const [errorAlta, setErrorAlta] = useState(null);
          const [diagHoja, setDiagHoja] = useState(null);   // [REV-14] verificación de la hoja destino
          // [FIX-24] Referencia del intento de alta en curso (anti-duplicados).
          const refAlta = useRef(null);
          const refBuscadorInv = useRef(null);   // [REV-14] atajo de teclado "/"
          
          const [searchTerm, setSearchTerm] = useState('');
          const [filterEstatus, setFilterEstatus] = usePreferencia('filterEstatus', 'Todos');
          const [filterUbicacion, setFilterUbicacion] = usePreferencia('filterUbicacion', 'Todas');
          // [REV-14] Orden y tamaño de página del inventario, también persistidos.
          const [ordenInv, setOrdenInv] = usePreferencia('ordenInv', { campo: 'numeroInventario', dir: 'asc' });
          const [tamPagina, setTamPagina] = usePreferencia('tamPagina', INVENTARIO_PAGE_SIZE);
          const [paginaActual, setPaginaActual] = useState(0);
          
          // Filtros Calendario — [REV-12] persistentes entre sesiones
          const [filterUbicacionCal, setFilterUbicacionCal] = usePreferencia('filterUbicacionCal', 'Todas');
          const [filterMesCal, setFilterMesCal] = usePreferencia('filterMesCal', 'Todos');
          const [searchControlCal, setSearchControlCal] = useState('');
          const [calendarYear, setCalendarYear] = usePreferencia('calendarYear', new Date().getFullYear());

          // [REV-12 · MEJORA 3] Lo que se teclea se pinta al instante; lo que
          // filtra la tabla es el valor diferido.
          const busquedaInventario  = useValorDiferido(searchTerm, 250);
          const busquedaCalendario  = useValorDiferido(searchControlCal, 250);
          const busquedaProveedores = useValorDiferido(provBusqueda, 250);

          // [REV-12 · MEJORA 6] Detalle del mantenimiento que se acaba de marcar
          // en el calendario. null = no hay nada pendiente de registrar.
          const [detalleMP, setDetalleMP] = useState(null);

          // ================================================================
          // [REV-13] MÓDULO DE ÓRDENES DE SERVICIO — estado
          // ----------------------------------------------------------------
          // Lee la hoja "Form Responses", que llena Jotform con cada orden
          // ejecutada. El rango por omisión es el mes en curso, porque es el
          // periodo con el que se arman los indicadores de COCASEP.
          // ================================================================
          const primerDiaMesISO = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
          };
          const [ordDesde, setOrdDesde]       = useState(primerDiaMesISO);
          const [ordHasta, setOrdHasta]       = useState(hoyISO);
          const [ordDatos, setOrdDatos]       = useState([]);
          const [ordCargando, setOrdCargando] = useState(false);
          const [ordHojaExiste, setOrdHojaExiste] = useState(true);
          const [ordLectura, setOrdLectura]   = useState(null);   // {filasLeidas, filasTotales}
          const [ordSel, setOrdSel]           = useState(null);   // orden abierta en el detalle
          const [ordBusqueda, setOrdBusqueda] = useState('');
          const [ordAvanzados, setOrdAvanzados] = useState(false);
          const [ordOrden, setOrdOrden]       = usePreferencia('ordOrden', 'fecha_desc');
          const [ordFiltros, setOrdFiltros]   = usePreferencia('ordFiltros', {
            area: 'Todas', tipo: 'Todos', empresa: 'Todas', frecuencia: 'Todas',
            reporta: 'Todos', falloPaciente: 'Todos', danoPaciente: 'Todos',
            validacion: 'Todos', apto: 'Todos', refacciones: 'Todos', firmas: 'Todas'
          });
          const busquedaOrdenes = useValorDiferido(ordBusqueda, 250);

          const fijarFiltroOrd = (clave, valor) =>
            setOrdFiltros(f => ({ ...f, [clave]: valor }));

          const limpiarFiltrosOrd = () => {
            setOrdBusqueda('');
            setOrdFiltros({
              area: 'Todas', tipo: 'Todos', empresa: 'Todas', frecuencia: 'Todas',
              reporta: 'Todos', falloPaciente: 'Todos', danoPaciente: 'Todos',
              validacion: 'Todos', apto: 'Todos', refacciones: 'Todos', firmas: 'Todas'
            });
          };

          const [selectedEquipo, setSelectedEquipo] = useState(null);
          const [isEditing, setIsEditing] = useState(false);
          const [equipoEditado, setEquipoEditado] = useState(null);
          
          const estadoInicialEquipo = {
            origen: inventarioTab, numero: '', numeroInventario: '', estatus: 'En Servicio', motivoFueraServicio: '', nombre: '', marca: '', polizaMantenimiento: 'NO', modelo: '', numeroSerie: '', fabricante: '', nivelRiesgo: 'I', ubicacion: '', fechaAlta: '', proveedorMantenimiento: '', descripcion: '', tipoTecnologia: 'Equipo Médico', frecuenciaMantenimiento: '', ultimoMantenimiento: '', proximoMantenimiento: '', historialEjecuciones: ''
          };
          const [nuevoEquipo, setNuevoEquipo] = useState(estadoInicialEquipo);

          // [SEC + PERF] Con sesión activa: primero se pintan los datos de la
          // última sincronización guardada en este navegador (arranque
          // instantáneo) y el getAll corre en segundo plano para actualizarlos.
          useEffect(() => {
            if (!usuarioActivo) return;
            const cacheado = CACHE_LOCAL.leer();
            if (cacheado && cacheado.datos) {
              setEquipos(cacheado.datos.equipos || []);
              setIndicadores(cacheado.datos.indicadores || []);
              setBitacora(cacheado.datos.bitacora || []);
              if (cacheado.datos.ultimaSync) setUltimaSync(cacheado.datos.ultimaSync + ' (guardado en este equipo)');
            }
            handleSyncSheets();
          }, [usuarioActivo]);

          // [REV-14 · MEJORA] "/" enfoca el buscador desde cualquier punto de la
          // pantalla. El técnico que llega con un equipo en la mano teclea el
          // folio sin soltar el ratón para ir al campo.
          useEffect(() => {
            const alTeclear = (ev) => {
              if (ev.key !== '/' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
              const foco = document.activeElement;
              const etiqueta = foco ? foco.tagName : '';
              if (etiqueta === 'INPUT' || etiqueta === 'TEXTAREA' || etiqueta === 'SELECT' ||
                  (foco && foco.isContentEditable)) return;
              if (!refBuscadorInv.current) return;
              ev.preventDefault();
              refBuscadorInv.current.focus();
              refBuscadorInv.current.select();
            };
            window.addEventListener('keydown', alTeclear);
            return () => window.removeEventListener('keydown', alTeclear);
          }, []);

          const esAccesoDenegado = (err) =>
            String((err && err.message) || '').indexOf('ACCESO_DENEGADO') > -1;

          const cerrarSesion = () => {
            SESION.limpiar();
            CACHE_LOCAL.limpiar();       // [SEC] no dejar datos en equipos compartidos
            limpiarPreferencias();       // [REV-12] tampoco los filtros guardados
            CACHE_EXPEDIENTES.clear();
            setUsuarioActivo('');
            setEquipos([]);
            setIndicadores([]);
            setBitacora([]);
            setSelectedEquipo(null);
            setSyncError(null);
          };

          // [REV-14 · PERF-32] La hoja activa se resuelve UNA vez y el resto de
          // los cálculos (filtros, catálogo de áreas, folio) parten de aquí, en
          // lugar de recorrer los 1,000+ equipos de las tres hojas cada vez.
          const equiposHoja = useMemo(
            () => equipos.filter(e => e.origen === inventarioTab),
            [equipos, inventarioTab]
          );

          const equiposFiltrados = useMemo(() => {
            const terminos = terminosBusqueda(busquedaInventario);
            const areaBuscada = normTexto(filterUbicacion);

            const lista = equiposHoja.filter(e => {
              // [FIX-B1] Estatus
              if (filterEstatus === 'Fuera de Servicio' && !estaFueraServicio(e)) return false;
              if (filterEstatus === 'En Servicio' && !estaEnServicio(e)) return false;
              if (filterEstatus === 'Sin estatus' && !sinEstatusCapturado(e)) return false;

              // [FIX-B3] Área comparada normalizada. En la hoja conviven
              // "UCIA", "ucia" y "UCIA " (con espacio final): el desplegable
              // los mostraba como opciones distintas y elegir una escondía a
              // los demás. Ahora se comparan sin acentos, sin dobles espacios
              // y sin distinguir mayúsculas.
              if (areaBuscada !== 'TODAS' && normTexto(e.ubicacion) !== areaBuscada) return false;

              // [FIX-B2] Búsqueda por términos sobre todos los campos útiles.
              // Antes solo miraba nombre, inventario, marca y serie: buscar por
              // modelo, área o proveedor no devolvía nada.
              return coincideTerminos(terminos, [
                e.numeroInventario, e.nombre, e.marca, e.modelo, e.numeroSerie,
                e.fabricante, e.ubicacion, e.proveedorMantenimiento,
                e.descripcion, e.estatus, e.motivoFueraServicio, e.nivelRiesgo
              ]);
            });

            // [REV-14 · MEJORA] Ordenamiento por columna
            const dir = ordenInv.dir === 'desc' ? -1 : 1;
            const valor = (e) => {
              if (ordenInv.campo === 'numeroInventario') {
                const m = String(e.numeroInventario || '').match(/(\d+)\s*$/);
                return m ? parseInt(m[1], 10) : Number.MAX_SAFE_INTEGER;
              }
              return normTexto(e[ordenInv.campo]);
            };
            return lista.sort((a, a2) => {
              const va = valor(a), vb = valor(a2);
              if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
              return String(va).localeCompare(String(vb), 'es') * dir;
            });
          }, [equiposHoja, busquedaInventario, filterEstatus, filterUbicacion, ordenInv]);

          // [NEW] Paginación del listado de Inventario.
          const totalPaginasInventario = Math.max(1, Math.ceil(equiposFiltrados.length / tamPagina));
          const paginaSegura = Math.min(paginaActual, totalPaginasInventario - 1);

          // [REV-14 · FIX-B4] paginaActual y la página realmente mostrada se
          // desincronizaban: si estabas en la página 12 y filtrabas a 2 páginas,
          // la pantalla mostraba la 2 pero el estado seguía en 12, así que había
          // que presionar "Atrás" diez veces antes de ver algún cambio.
          useEffect(() => {
            if (paginaActual > totalPaginasInventario - 1) setPaginaActual(totalPaginasInventario - 1);
          }, [totalPaginasInventario, paginaActual]);

          const equiposPagina = useMemo(() => {
              const inicio = paginaSegura * tamPagina;
              return equiposFiltrados.slice(inicio, inicio + tamPagina);
          }, [equiposFiltrados, paginaSegura, tamPagina]);

          // [FIX-B3] Catálogo de áreas deduplicado de forma normalizada: una
          // sola entrada por área real, mostrando la variante más frecuente.
          const ubicacionesUnicas = useMemo(() => {
              const conteo = new Map();   // clave normalizada -> {etiqueta, n}
              equiposHoja.forEach(e => {
                  const bruto = String(e.ubicacion || '').trim();
                  if (!bruto) return;
                  const clave = normTexto(bruto);
                  const prev = conteo.get(clave);
                  if (!prev) conteo.set(clave, { etiqueta: bruto, n: 1 });
                  else prev.n++;
              });
              const etiquetas = Array.from(conteo.values())
                  .map(v => v.etiqueta)
                  .sort((a, b) => a.localeCompare(b, 'es'));
              return ['Todas', ...etiquetas];
          }, [equiposHoja]);

          // Índice normalizado para validar los filtros guardados sin depender
          // de que la escritura coincida carácter por carácter.
          const areasNormalizadas = useMemo(
            () => new Set(ubicacionesUnicas.map(normTexto)),
            [ubicacionesUnicas]
          );

          // [REV-12] Los filtros guardados podrían apuntar a un área que ya no
          // existe en la hoja cargada (o que no existe en esta hoja): en ese caso
          // se regresan a "Todas" en lugar de dejar la tabla vacía sin explicación.
          useEffect(() => {
            if (!equipos.length) return;
            if (filterUbicacion !== 'Todas' && !areasNormalizadas.has(normTexto(filterUbicacion))) {
              setFilterUbicacion('Todas');
            }
            if (filterUbicacionCal !== 'Todas' && !areasNormalizadas.has(normTexto(filterUbicacionCal))) {
              setFilterUbicacionCal('Todas');
            }
          }, [areasNormalizadas, equipos.length]);

          // [REV-14 · MEJORA] Resumen de filtros activos. Un filtro guardado de
          // la sesión anterior (p. ej. "Sólo Fuera de Servicio") dejaba la tabla
          // casi vacía al abrir el CMMS y no había nada en pantalla que lo
          // explicara. Ahora se ven como etiquetas, con un botón para limpiarlos.
          const filtrosActivosInv = useMemo(() => {
            const f = [];
            if (searchTerm.trim()) f.push({ k: 'texto', txt: `Texto: "${searchTerm.trim()}"` });
            if (filterUbicacion !== 'Todas') f.push({ k: 'area', txt: `Área: ${filterUbicacion}` });
            if (filterEstatus !== 'Todos') f.push({ k: 'estatus', txt: `Estatus: ${filterEstatus}` });
            return f;
          }, [searchTerm, filterUbicacion, filterEstatus]);

          const limpiarFiltrosInv = () => {
            setSearchTerm('');
            setFilterUbicacion('Todas');
            setFilterEstatus('Todos');
            setPaginaActual(0);
          };

          const quitarFiltroInv = (k) => {
            if (k === 'texto') setSearchTerm('');
            if (k === 'area') setFilterUbicacion('Todas');
            if (k === 'estatus') setFilterEstatus('Todos');
            setPaginaActual(0);
          };
